<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code skill taxonomy · Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · Diagram Design</p>
    <h1>Claude Code skill taxonomy</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tree-dark-title tree-dark-desc">
      <title id="tree-dark-title">Claude Code skill taxonomy</title>
      <desc id="tree-dark-desc">Tree diagram showing a Skills root branching into Design, Engineering, and Research categories and their leaf skills.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Tier tags (left margin) -->
        <text x="40" y="108" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
        <text x="40" y="224" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 1</text>
        <text x="40" y="324" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 2</text>

        <!-- Connectors drawn first (behind nodes) -->
        <!-- Root → Tier 1 bus -->
        <path d="M 500 128 L 500 168 L 220 168 L 220 208" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>
        <path d="M 500 168 L 500 208" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>
        <path d="M 500 168 L 780 168 L 780 208" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>

        <!-- Design → leaves -->
        <path d="M 220 256 L 220 296 L 140 296 L 140 336" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>
        <path d="M 220 296 L 300 296 L 300 336" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>

        <!-- Engineering → leaves -->
        <path d="M 500 256 L 500 296 L 480 296 L 480 336" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>
        <path d="M 500 296 L 660 296 L 660 336" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>

        <!-- Research → single leaf -->
        <path d="M 780 256 L 780 296 L 840 296 L 840 336" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>

        <!-- Root node: Skills (gold focal) -->
        <rect x="420" y="80" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="420" y="80" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1"/>
        <rect x="428" y="88" width="32" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-accent) 50%, transparent)" stroke-width="0.8"/>
        <text x="444" y="97" fill="var(--dd-accent)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="500" y="118" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Skills</text>

        <!-- Tier 1: Design -->
        <rect x="140" y="208" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="140" y="208" width="160" height="48" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="var(--dd-ink)" stroke-width="1"/>
        <rect x="148" y="216" width="28" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="162" y="225" fill="var(--dd-ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="220" y="240" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Design</text>
        <text x="220" y="252" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ui · visual · ux</text>

        <!-- Tier 1: Engineering -->
        <rect x="420" y="208" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="420" y="208" width="160" height="48" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="var(--dd-ink)" stroke-width="1"/>
        <rect x="428" y="216" width="28" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="442" y="225" fill="var(--dd-ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="500" y="240" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Engineering</text>
        <text x="500" y="252" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ship · review · test</text>

        <!-- Tier 1: Research -->
        <rect x="700" y="208" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="700" y="208" width="160" height="48" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="var(--dd-ink)" stroke-width="1"/>
        <rect x="708" y="216" width="28" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 40%, transparent)" stroke-width="0.8"/>
        <text x="722" y="225" fill="var(--dd-ink)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="780" y="240" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Research</text>
        <text x="780" y="252" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">investigate · analyze</text>

        <!-- Tier 2: polish -->
        <rect x="60" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="60" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-wash-5)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <text x="140" y="360" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">polish</text>
        <text x="140" y="372" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">align · space · rhythm</text>

        <!-- Tier 2: critique -->
        <rect x="220" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="220" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-wash-5)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <text x="300" y="360" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">critique</text>
        <text x="300" y="372" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hierarchy · density</text>

        <!-- Tier 2: review -->
        <rect x="400" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="400" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-wash-5)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <text x="480" y="360" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">review</text>
        <text x="480" y="372" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pre-land diff · sql</text>

        <!-- Tier 2: ship -->
        <rect x="580" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="580" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-wash-5)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <text x="660" y="360" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">ship</text>
        <text x="660" y="372" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merge · deploy · verify</text>

        <!-- Tier 2: investigate -->
        <rect x="760" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="760" y="336" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-wash-5)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <text x="840" y="360" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">investigate</text>
        <text x="840" y="372" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">root cause · evidence</text>

        <!-- Legend strip -->
        <line x1="40" y1="412" x2="960" y2="412" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="428" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="444" width="14" height="10" rx="2" class="dd-tag" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1"/>
        <text x="60" y="452" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Root · focal</text>

        <rect x="180" y="444" width="14" height="10" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="var(--dd-ink)" stroke-width="1"/>
        <text x="200" y="452" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Category branch</text>

        <rect x="340" y="444" width="14" height="10" rx="2" class="dd-tag" fill="var(--dd-wash-5)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <text x="360" y="452" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Leaf skill</text>

        <text x="500" y="452" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif" font-style="italic">Orthogonal connectors only. Gold marks the root — every branch descends from one idea.</text>
      </svg>
  </div>
</body>
</html>
