<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northwind Retail · Current IT Landscape · Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&amp;family=DM+Sans:wght@300;400;500&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --sans: 'DM Sans',system-ui,sans-serif;
      --serif: 'Cormorant Garamond',serif;
      --mono: 'Geist Mono',ui-monospace,monospace;
    }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; background:var(--dd-paper); color:var(--dd-ink); font-family:var(--sans); }
    .frame { width:100%; max-width:1200px; }
    .eyebrow { margin-bottom:.5rem; color:var(--dd-muted); font:500 .66rem/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:.35rem; color:var(--dd-ink); font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif); letter-spacing:-.02em; }
    .subtitle { margin-bottom:1.5rem; color:var(--dd-muted); font-size:.9rem; line-height:1.5; }
    .diagram { overflow-x:auto; } svg { display:block; width:100%; min-width:920px; }
    svg .zone { fill:color-mix(in srgb, var(--dd-ink) 4%, transparent); stroke:color-mix(in srgb, var(--dd-ink) 14%, transparent); stroke-width:.8; }
    svg .zone-mask, svg .node-mask, svg .label-mask { fill:var(--dd-paper); }
    svg .zone-label, svg .arrow-label, svg .legend-label { font-family:'Geist Mono',monospace; }
    svg .zone-label { fill:color-mix(in srgb, var(--dd-ink) 40%, transparent); font-size:8px; letter-spacing:.14em; }
    svg .node { fill:color-mix(in srgb, var(--dd-ink) 4%, transparent); stroke:color-mix(in srgb, var(--dd-ink) 32%, transparent); stroke-width:1; }
    svg .node.external { stroke:var(--dd-muted); stroke-dasharray:4 3; }
    svg .node.focal { fill:color-mix(in srgb, var(--dd-accent) 12%, transparent); stroke:var(--dd-accent); stroke-width:1.4; }
    svg .node.survivor { fill:color-mix(in srgb, var(--dd-series-1) 10%, transparent); stroke:color-mix(in srgb, var(--dd-series-1) 55%, transparent); }
    svg .node-name { fill:var(--dd-ink); font:600 12px 'DM Sans',sans-serif; }
    svg .node-name.survivor { fill:var(--dd-series-1); }
    svg .sub { fill:var(--dd-muted); font:400 10px 'Geist Mono',monospace; } svg .sub.focal { fill:var(--dd-accent); }
    svg .arrow-label { font-size:8px; font-weight:600; letter-spacing:.08em; } svg .legend-label { fill:var(--dd-muted); font-size:8px; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">IT current-state · Northwind Retail</p>
    <h1>Legacy retail reporting landscape</h1>
    <p class="subtitle">File exports, desktop spreadsheets, and manual publication before a shared data platform.</p>
    <div class="diagram">

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
          <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2"/></symbol>
          <symbol id="icon-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M7 20h10M9 16v4M15 16v4"/></symbol>
          <symbol id="icon-db" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
          <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 4.5a4 4 0 0 1 0 7M18 15a4 4 0 0 1 3 4v2"/></symbol>
        </defs>
        <rect width="960" height="500" fill="var(--dd-paper)"/>
        <rect class="zone dd-container" x="16" y="52" width="256" height="360" rx="8"/><rect class="zone-mask" x="36" y="44" width="92" height="16"/><text class="zone-label" x="40" y="56">COLLECTION</text>
        <rect class="zone dd-container" x="292" y="52" width="360" height="360" rx="8"/><rect class="zone-mask" x="312" y="44" width="92" height="16"/><text class="zone-label" x="316" y="56">PROCESSING</text>
        <rect class="zone dd-container" x="672" y="52" width="272" height="360" rx="8"/><rect class="zone-mask" x="692" y="44" width="116" height="16"/><text class="zone-label" x="696" y="56">DISSEMINATION</text>

        <path d="M 252,108 H 340" fill="none" stroke="var(--dd-link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 252,196 H 308 Q 316,196 316,188 V 132 Q 316,124 324,124 H 340" fill="none" stroke="var(--dd-link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 252,284 H 324 Q 332,284 332,276 V 144 Q 332,136 340,136" fill="none" stroke="var(--dd-link)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-link)"/>
        <line x1="472" y1="148" x2="472" y2="232" stroke="var(--dd-accent)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
        <line x1="472" y1="304" x2="472" y2="344" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 604,268 H 654 Q 662,268 662,260 V 72 Q 662,64 670,64 H 800 Q 808,64 808,72 V 80" fill="none" stroke="var(--dd-accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="808" y1="140" x2="808" y2="216" stroke="var(--dd-link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="808" y1="272" x2="808" y2="344" stroke="var(--dd-link)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-link)"/>

        <rect class="node-mask dd-node" x="36" y="80" width="216" height="56" rx="6"/><rect class="node dd-node" x="36" y="80" width="216" height="56" rx="6"/><use href="#icon-file" x="48" y="96" width="24" height="24" color="var(--dd-ink)"/><text class="node-name" x="80" y="106">Point-of-Sale Exports</text><text class="sub" x="80" y="122">nightly · CSV</text>
        <rect class="node-mask dd-node" x="36" y="168" width="216" height="56" rx="6"/><rect class="node dd-node" x="36" y="168" width="216" height="56" rx="6"/><use href="#icon-file" x="48" y="184" width="24" height="24" color="var(--dd-ink)"/><text class="node-name" x="80" y="194">Online Store Export</text><text class="sub" x="80" y="210">orders · flat file</text>
        <rect class="node-mask dd-node" x="36" y="256" width="216" height="56" rx="6"/><rect class="node external dd-node" x="36" y="256" width="216" height="56" rx="6"/><use href="#icon-file" x="48" y="272" width="24" height="24" color="var(--dd-muted)"/><text class="node-name" x="80" y="282">Supplier Price Lists</text><text class="sub" x="80" y="298">external · XLSX</text>
        <rect class="node-mask dd-node" x="340" y="80" width="264" height="68" rx="6"/><rect class="node focal dd-node" x="340" y="80" width="264" height="68" rx="6"/><use href="#icon-file" x="352" y="100" width="24" height="24" color="var(--dd-accent)"/><text class="node-name" x="384" y="108">Shared Drive</text><text class="sub focal" x="384" y="124">no version control</text><text class="sub" x="384" y="140">department folders</text>
        <rect class="node-mask dd-node" x="340" y="232" width="264" height="72" rx="6"/><rect class="node dd-node" x="340" y="232" width="264" height="72" rx="6"/><use href="#icon-screen" x="352" y="256" width="24" height="24" color="var(--dd-ink)"/><text class="node-name" x="384" y="262">Spreadsheet Handoffs</text><text class="sub" x="384" y="278">local workbooks · macros</text><text class="sub" x="384" y="292">manual reconciliation</text>
        <rect class="node-mask dd-node" x="340" y="344" width="264" height="56" rx="6"/><rect class="node survivor dd-node" x="340" y="344" width="264" height="56" rx="6"/><use href="#icon-db" x="352" y="360" width="24" height="24" color="var(--dd-series-1)"/><text class="node-name survivor" x="384" y="370">On-prem RDBMS</text><text class="sub" x="384" y="386">inventory · finance</text>
        <rect class="node-mask dd-node" x="704" y="80" width="208" height="60" rx="6"/><rect class="node focal dd-node" x="704" y="80" width="208" height="60" rx="6"/><use href="#icon-screen" x="716" y="100" width="24" height="24" color="var(--dd-accent)"/><text class="node-name" x="748" y="108">Reporting Portal</text><text class="sub focal" x="748" y="124">manual refresh</text>
        <rect class="node-mask dd-node" x="704" y="216" width="208" height="56" rx="6"/><rect class="node dd-node" x="704" y="216" width="208" height="56" rx="6"/><use href="#icon-file" x="716" y="232" width="24" height="24" color="var(--dd-ink)"/><text class="node-name" x="748" y="242">Email Report Packs</text><text class="sub" x="748" y="258">weekly · PDF</text>
        <rect class="node-mask dd-node" x="704" y="344" width="208" height="56" rx="6"/><rect class="node external dd-node" x="704" y="344" width="208" height="56" rx="6"/><use href="#icon-users" x="716" y="360" width="24" height="24" color="var(--dd-muted)"/><text class="node-name" x="748" y="370">Regional Managers</text><text class="sub" x="748" y="386">12 store regions</text>

        <rect class="label-mask dd-tag" x="260" y="86" width="40" height="16" rx="2"/><text class="arrow-label" x="280" y="98" text-anchor="middle" fill="var(--dd-link)">CSV</text>
        <rect class="label-mask dd-tag" x="260" y="174" width="52" height="16" rx="2"/><text class="arrow-label" x="286" y="186" text-anchor="middle" fill="var(--dd-link)">EXPORT</text>
        <rect class="label-mask dd-tag" x="260" y="262" width="44" height="16" rx="2"/><text class="arrow-label" x="282" y="274" text-anchor="middle" fill="var(--dd-link)">XLSX</text>
        <rect class="label-mask dd-tag" x="478" y="156" width="40" height="16" rx="2"/><text class="arrow-label" x="498" y="168" text-anchor="middle" fill="var(--dd-accent)">COPY</text>

        <rect class="label-mask dd-tag" x="814" y="280" width="48" height="16" rx="2"/><text class="arrow-label" x="838" y="292" text-anchor="middle" fill="var(--dd-link)">EMAIL</text>

        <line x1="16" y1="440" x2="944" y2="440" stroke="var(--dd-rule)" stroke-width="0.8"/><text class="legend-label" x="16" y="460" letter-spacing=".14em">LEGEND</text>
        <line x1="80" y1="456" x2="104" y2="456" stroke="var(--dd-link)" stroke-width="1.2"/><text class="legend-label" x="112" y="460">data flow</text>
        <line x1="208" y1="456" x2="232" y2="456" stroke="var(--dd-accent)" stroke-width="1.4"/><text class="legend-label" x="240" y="460">pain-point</text>
        <rect x="372" y="450" width="16" height="12" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="var(--dd-muted)" stroke-width=".8" stroke-dasharray="4 3"/><text class="legend-label" x="396" y="460">external</text>
        <rect x="492" y="450" width="16" height="12" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-accent) 12%, transparent)" stroke="var(--dd-accent)"/><text class="legend-label" x="516" y="460">bottleneck</text>
      </svg>
    </div>
  </main>
</body>
</html>
