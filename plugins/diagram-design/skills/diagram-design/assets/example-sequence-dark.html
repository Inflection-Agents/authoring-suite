<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article request · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Article request, cold cache</h1>

    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-dark-title sequence-dark-desc">
      <title id="sequence-dark-title">Article request, cold cache</title>
      <desc id="sequence-dark-desc">Sequence diagram showing a cold-cache article request moving from reader and browser through Cloudflare to an Astro origin and analytics beacon.</desc>
        <defs>
          <!-- Dot grid background -->
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>

          <!-- Arrow markers -->
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/>
          </marker>
        </defs>

        <!-- Background: paper + dot grid -->
        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- =================================================================
             LIFELINES — dashed vertical lines from each actor, behind everything.
             Actor lifeline x-coords: 128, 352, 584, 800
             ================================================================= -->
        <line x1="128" y1="128" x2="128" y2="488" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="352" y1="128" x2="352" y2="488" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="584" y1="128" x2="584" y2="488" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="128" x2="800" y2="488" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================================================================
             ACTIVATION BARS — w=8 rects on lifelines showing control duration.
             Drawn before message arrows so arrows land on their edges.
             ================================================================= -->
        <!-- Cloudflare activation: receives at y=176, responds at y=408 -->
        <rect x="348" y="180" width="8" height="232" fill="color-mix(in srgb, var(--dd-ink) 6%, transparent)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <!-- Astro activation: called at y=232, returns at y=352 -->
        <rect x="580" y="236" width="8" height="120" fill="color-mix(in srgb, var(--dd-ink) 6%, transparent)" stroke="var(--dd-muted)" stroke-width="0.8"/>

        <!-- =================================================================
             MESSAGE ARROWS — time flows top→down.
             Draw before labels so label masks cover the line.
             ================================================================= -->

        <!-- M1: Reader → Cloudflare  (HTTPS request · link-blue) -->
        <line x1="128" y1="176" x2="352" y2="176" stroke="var(--dd-link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- M2: Cloudflare → Astro  (cache miss · muted) -->
        <line x1="352" y1="232" x2="580" y2="232" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M3: Astro self-message  (render MDX · muted U-loop) -->
        <path d="M 588 284 L 624 284 L 624 316 L 588 316" fill="none" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M4: Astro → Cloudflare  (return HTML · muted dashed) -->
        <line x1="580" y1="352" x2="356" y2="352" stroke="var(--dd-muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M5: Cloudflare → Reader  (primary success · gold) -->
        <line x1="348" y1="408" x2="128" y2="408" stroke="var(--dd-accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- M6: Reader → Analytics  (async beacon · muted dashed) -->
        <line x1="128" y1="464" x2="800" y2="464" stroke="var(--dd-muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- =================================================================
             MESSAGE LABELS — each with an opaque paper-colored mask.
             ================================================================= -->

        <!-- M1 label -->
        <rect x="188" y="160" width="104" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="240" y="170" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /ARTICLES/SLUG</text>

        <!-- M2 label -->
        <rect x="416" y="216" width="100" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="466" y="226" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE MISS · ORIGIN</text>

        <!-- M3 label (to the right of the self-loop) -->
        <rect x="632" y="292" width="72" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="668" y="302" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RENDER MDX</text>

        <!-- M4 label -->
        <rect x="420" y="336" width="96" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="468" y="346" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · HTML + MAX-AGE</text>

        <!-- M5 label (gold · primary response) -->
        <rect x="192" y="392" width="96" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="240" y="402" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · EDGE-CACHED</text>

        <!-- M6 label (placed between Astro and Analytics lifelines, a clear gap) -->
        <rect x="648" y="448" width="96" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="696" y="458" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PAGEVIEW BEACON</text>

        <!-- =================================================================
             ACTOR BOXES — drawn after arrows/labels.
             Each actor: 144–160 wide × 56 tall. Centers: 128, 352, 584, 800.
             ================================================================= -->

        <!-- Actor 1: Reader (external / soft) -->
        <path d="M 58,72 H 192 L 200,80 V 120 L 192,128 H 58 A 2,2 0 0 1 56,126 V 74 A 2,2 0 0 1 58,72 Z" class="dd-node" fill="var(--dd-paper)"/>
        <path d="M 58,72 H 192 L 200,80 V 120 L 192,128 H 58 A 2,2 0 0 1 56,126 V 74 A 2,2 0 0 1 58,72 Z" class="dd-node" fill="var(--dd-wash-10)" stroke="var(--dd-soft)" stroke-width="1"/>
        <rect x="64" y="80" width="28" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-muted) 40%, transparent)" stroke-width="0.8"/>
        <text x="78" y="89" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="128" y="104" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Reader</text>
        <text x="128" y="119" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser</text>

        <!-- Actor 2: Cloudflare (cloud / muted) -->
        <path d="M 282,72 H 416 L 424,80 V 120 L 416,128 H 282 A 2,2 0 0 1 280,126 V 74 A 2,2 0 0 1 282,72 Z" class="dd-node" fill="var(--dd-paper)"/>
        <path d="M 282,72 H 416 L 424,80 V 120 L 416,128 H 282 A 2,2 0 0 1 280,126 V 74 A 2,2 0 0 1 282,72 Z" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <rect x="288" y="80" width="32" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="0.8"/>
        <text x="304" y="89" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="352" y="104" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Cloudflare</text>
        <text x="352" y="119" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pages · cache</text>

        <!-- Actor 3: Astro Origin (focal / gold) -->
        <rect x="504" y="72" width="160" height="56" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="504" y="72" width="160" height="56" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-accent) 8%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
        <rect x="512" y="80" width="32" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-accent) 50%, transparent)" stroke-width="0.8"/>
        <text x="528" y="89" fill="var(--dd-accent)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
        <text x="584" y="104" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Astro Origin</text>
        <text x="584" y="119" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSR + MDX</text>

        <!-- Actor 4: Analytics (optional / dashed) -->
        <rect x="728" y="72" width="144" height="56" rx="6" class="dd-node" fill="var(--dd-paper)"/>
        <rect x="728" y="72" width="144" height="56" rx="6" class="dd-node" fill="var(--dd-wash-2)" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="736" y="80" width="28" height="12" rx="2" class="dd-tag" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="0.8"/>
        <text x="750" y="89" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASY</text>
        <text x="800" y="104" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Analytics</text>
        <text x="800" y="119" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Beacon · async</text>

        <!-- =================================================================
             LEGEND — horizontal strip at the bottom.
             Separator at y=504, eyebrow at y=520, items at y=540–548.
             ================================================================= -->
        <line x1="56" y1="504" x2="944" y2="504" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="56" y="520" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <!-- Item 1: Actor swatch (gold focal) -->
        <rect x="56" y="540" width="14" height="10" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-accent) 8%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
        <text x="76" y="548" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Focal actor</text>

        <!-- Item 2: Activation bar swatch -->
        <rect x="188" y="536" width="4" height="18" fill="color-mix(in srgb, var(--dd-ink) 6%, transparent)" stroke="var(--dd-muted)" stroke-width="0.8"/>
        <text x="200" y="548" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Activation</text>

        <!-- Item 3: Request arrow (link-blue) -->
        <line x1="308" y1="546" x2="336" y2="546" stroke="var(--dd-link)" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="344" y="548" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">HTTP request</text>

        <!-- Item 4: Return / async (muted dashed) -->
        <line x1="476" y1="546" x2="504" y2="546" stroke="var(--dd-muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="512" y="548" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Return / async</text>

        <!-- Item 5: Primary response (gold) -->
        <line x1="652" y1="546" x2="680" y2="546" stroke="var(--dd-accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="688" y="548" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Primary response</text>

      </svg>
  </div>
</body>
</html>
