<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content pyramid · what compounds</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramid · Diagram Design</p>
    <h1>Content pyramid · what compounds</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pyramid-title pyramid-desc">
      <title id="pyramid-title">Content pyramid · what compounds</title>
      <desc id="pyramid-desc">Content pyramid showing short posts, essays, long-form guides, and a flagship book ordered by shipping cadence and leverage.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Left axis: direction of rarity -->
        <line x1="100" y1="40" x2="100" y2="320" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <polygon points="96,40 104,40 100,28" fill="color-mix(in srgb, var(--dd-ink) 45%, transparent)"/>
        <text x="80" y="216" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="middle" transform="rotate(-90 80 216)">RARER · FEWER · COMPOUNDS ↑</text>

        <!-- Base layer: Short posts -->
        <polygon points="244,280 756,280 820,344 180,344" fill="var(--dd-paper-2)" stroke="var(--dd-rule)" stroke-width="1"/>
        <text x="500" y="308" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Short posts</text>
        <text x="500" y="324" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">daily · ~200 words</text>
        <text x="836" y="316" fill="var(--dd-soft)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">~240/yr</text>

        <!-- L3: Essays -->
        <polygon points="308,216 692,216 756,280 244,280" fill="var(--dd-paper-2)" stroke="var(--dd-rule)" stroke-width="1"/>
        <text x="500" y="244" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Essays</text>
        <text x="500" y="260" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">weekly · 800–1,500 words</text>
        <text x="776" y="252" fill="var(--dd-soft)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">~48/yr</text>

        <!-- L2: Long-form guides -->
        <polygon points="372,152 628,152 692,216 308,216" fill="var(--dd-paper-2)" stroke="var(--dd-rule)" stroke-width="1"/>
        <text x="500" y="180" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Long-form guides</text>
        <text x="500" y="196" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quarterly · 4,000+ words</text>
        <text x="716" y="188" fill="var(--dd-soft)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">~4/yr</text>

        <!-- Apex: Flagship book — GOLD FOCAL (true pyramid peak — single triangle, consistent slope with layers below) -->
        <polygon points="500,24 628,152 372,152" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1"/>
        <text x="500" y="120" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Flagship book</text>
        <text x="500" y="136" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every 3–5 years</text>
        <text x="656" y="112" fill="var(--dd-accent)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">the apex</text>

        <!-- Footnote under pyramid -->
        <text x="500" y="384" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif" text-anchor="middle" font-style="italic">The base funds the apex. The apex defines the base.</text>

        <!-- Legend -->
        <line x1="40" y1="436" x2="960" y2="436" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="452" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="464" width="16" height="12" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1"/>
        <text x="64" y="474" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Apex — rarest, highest leverage</text>

        <rect x="280" y="464" width="16" height="12" fill="var(--dd-paper-2)" stroke="color-mix(in srgb, var(--dd-ink) 25%, transparent)" stroke-width="1"/>
        <text x="304" y="474" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Supporting layer — the volume work</text>

        <text x="560" y="474" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif" font-style="italic">Layer width is honest: narrower = rarer shipping cadence.</text>
      </svg>
  </div>
</body>
</html>
