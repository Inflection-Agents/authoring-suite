<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingestion platform · Zoom into Transform</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Zoom · Diagram Design</p>
    <h1>Ingestion platform · zoom into Transform</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="zoom-title zoom-desc">
      <title id="zoom-title">Ingestion platform, zoomed into the Transform step</title>
      <desc id="zoom-desc">A reduced reproduction of the ingestion pipeline marks Transform as the expanded element. Below, Transform's internals show Schema Registry feeding Validate, which feeds Normalise and Enrich, with a Quarantine branch on failure.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
        </pattern>
        <marker id="arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="var(--dd-muted)"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Correspondence wedge: a closed frustum, not a connector between nodes — it
           frames the marked element opening into its own expansion below. -->
      <path d="M264,64 L40,160 L960,160 L352,64 Z" fill="var(--dd-wash-3)" stroke="var(--dd-rule-solid)" stroke-width="1"/>
      <rect x="512" y="128" width="80" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
      <text x="552" y="136" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DETAIL OF</text>

      <!-- Parent: reduced, quieted reproduction — orientation, not content -->
      <line x1="128" y1="52" x2="152" y2="52" stroke="var(--dd-soft)" stroke-width="0.8" marker-end="url(#arr-muted)"/>
      <line x1="240" y1="52" x2="264" y2="52" stroke="var(--dd-soft)" stroke-width="0.8" marker-end="url(#arr-muted)"/>
      <line x1="352" y1="52" x2="376" y2="52" stroke="var(--dd-soft)" stroke-width="0.8" marker-end="url(#arr-muted)"/>
      <line x1="464" y1="52" x2="488" y2="52" stroke="var(--dd-soft)" stroke-width="0.8" marker-end="url(#arr-muted)"/>
      <line x1="308" y1="88" x2="308" y2="64" stroke="var(--dd-soft)" stroke-width="0.8" stroke-dasharray="3,2"/>

      <rect x="40" y="40" width="88" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="84" y="56" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Sources</text>

      <rect x="152" y="40" width="88" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="196" y="56" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Ingest Gateway</text>

      <rect x="264" y="40" width="88" height="24" rx="4" class="dd-node" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1.4"/>
      <text x="308" y="56" fill="var(--dd-accent)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Transform</text>

      <rect x="376" y="40" width="88" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="420" y="56" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Warehouse</text>

      <rect x="488" y="40" width="88" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="532" y="56" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Serving API</text>

      <rect x="264" y="88" width="88" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="308" y="104" fill="var(--dd-soft)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Observability</text>

      <!-- Expansion frame: majority of the canvas -->
      <rect x="40" y="160" width="920" height="280" rx="8" class="dd-container" fill="var(--dd-paper-2)" stroke="color-mix(in srgb, var(--dd-ink) 20%, transparent)" stroke-width="1"/>
      <text x="64" y="184" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRANSFORM · DETAIL</text>

      <!-- Expansion connectors -->
      <line x1="240" y1="232" x2="280" y2="232" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="440" y1="232" x2="480" y2="232" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="640" y1="232" x2="680" y2="232" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="360" y1="264" x2="360" y2="320" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
      <rect x="316" y="284" width="88" height="12" rx="2" class="dd-tag" fill="var(--dd-paper-2)"/>
      <text x="360" y="292" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON FAILURE</text>

      <!-- Schema Registry -->
      <rect x="80" y="200" width="160" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="96" y="216" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP</text>
      <text x="96" y="236" fill="var(--dd-ink)" font-size="13" font-weight="600" font-family="'DM Sans', sans-serif">Schema Registry</text>
      <text x="96" y="252" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">validates shape</text>

      <!-- Validate -->
      <rect x="280" y="200" width="160" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="296" y="216" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP</text>
      <text x="296" y="236" fill="var(--dd-ink)" font-size="13" font-weight="600" font-family="'DM Sans', sans-serif">Validate</text>
      <text x="296" y="252" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">required fields</text>

      <!-- Normalise -->
      <rect x="480" y="200" width="160" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="496" y="216" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP</text>
      <text x="496" y="236" fill="var(--dd-ink)" font-size="13" font-weight="600" font-family="'DM Sans', sans-serif">Normalise</text>
      <text x="496" y="252" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">casing · units</text>

      <!-- Enrich -->
      <rect x="680" y="200" width="160" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="696" y="216" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP</text>
      <text x="696" y="236" fill="var(--dd-ink)" font-size="13" font-weight="600" font-family="'DM Sans', sans-serif">Enrich</text>
      <text x="696" y="252" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">geo · currency</text>

      <!-- Quarantine (focal) -->
      <rect x="280" y="320" width="160" height="64" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <text x="296" y="336" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP · FOCAL</text>
      <text x="296" y="356" fill="var(--dd-ink)" font-size="13" font-weight="600" font-family="'DM Sans', sans-serif">Quarantine</text>
      <text x="296" y="372" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">failed records</text>
    </svg>
  </div>
</body>
</html>
