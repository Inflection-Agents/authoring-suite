<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content ideas · Impact × Effort</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · Diagram Design</p>
    <h1>Content ideas · Impact × Effort</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quadrant-dark-title quadrant-dark-desc">
      <title id="quadrant-dark-title">Content ideas · Impact × Effort</title>
      <desc id="quadrant-dark-desc">Impact-effort matrix showing eight content projects across do first, major projects, quick wins, and avoid quadrants.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Quadrant backgrounds (very subtle, only gold on DO FIRST) -->
        <rect x="120" y="80" width="380" height="170" fill="color-mix(in srgb, var(--dd-accent) 3%, transparent)"/>

        <!-- Axis cross -->
        <line x1="120" y1="250" x2="880" y2="250" stroke="color-mix(in srgb, var(--dd-ink) 45%, transparent)" stroke-width="1"/>
        <line x1="500" y1="80" x2="500" y2="420" stroke="color-mix(in srgb, var(--dd-ink) 45%, transparent)" stroke-width="1"/>

        <!-- Axis end labels -->
        <text x="880" y="266" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">HIGH EFFORT →</text>
        <text x="120" y="266" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">← LOW EFFORT</text>
        <text x="512" y="80" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">↑ HIGH IMPACT</text>
        <text x="512" y="432" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">↓ LOW IMPACT</text>

        <!-- Quadrant corner labels -->
        <text x="140" y="104" fill="var(--dd-accent)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em" font-weight="600">DO FIRST</text>
        <text x="860" y="104" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">MAJOR PROJECTS</text>
        <text x="140" y="412" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">QUICK WINS</text>
        <text x="860" y="412" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>

        <!-- Items: TL (Do First) -->
        <!-- gold focal -->
        <circle cx="220" cy="140" r="6" fill="var(--dd-accent)"/>
        <text x="232" y="144" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif">Schematic skill v4</text>

        <circle cx="320" cy="200" r="4" fill="var(--dd-ink)"/>
        <text x="332" y="204" fill="var(--dd-muted)" font-size="11" font-family="'DM Sans', sans-serif">Update changelog</text>

        <!-- Items: TR (Major Projects) -->
        <circle cx="620" cy="140" r="4" fill="var(--dd-ink)"/>
        <text x="632" y="144" fill="var(--dd-muted)" font-size="11" font-family="'DM Sans', sans-serif">Design v4 refresh</text>

        <circle cx="760" cy="180" r="4" fill="var(--dd-ink)"/>
        <text x="772" y="184" fill="var(--dd-muted)" font-size="11" font-family="'DM Sans', sans-serif">New publication</text>

        <!-- Items: BL (Quick Wins) -->
        <circle cx="260" cy="320" r="4" fill="var(--dd-ink)"/>
        <text x="272" y="324" fill="var(--dd-muted)" font-size="11" font-family="'DM Sans', sans-serif">Fix footer link</text>

        <circle cx="360" cy="380" r="4" fill="var(--dd-ink)"/>
        <text x="372" y="384" fill="var(--dd-muted)" font-size="11" font-family="'DM Sans', sans-serif">Update OG tags</text>

        <!-- Items: BR (Avoid) -->
        <circle cx="640" cy="380" r="4" fill="var(--dd-ink)"/>
        <text x="652" y="384" fill="var(--dd-muted)" font-size="11" font-family="'DM Sans', sans-serif">Rewrite build pipeline</text>

        <circle cx="780" cy="320" r="4" fill="var(--dd-ink)"/>
        <text x="792" y="324" fill="var(--dd-muted)" font-size="11" font-family="'DM Sans', sans-serif">Port to Nuxt</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="472" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="var(--dd-accent)"/>
        <text x="68" y="492" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Start tomorrow</text>

        <circle cx="192" cy="488" r="4" fill="var(--dd-ink)"/>
        <text x="208" y="492" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Candidate project</text>

        <text x="336" y="492" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif" font-style="italic">Position is the signal. Colour is reserved for the single action item.</text>
      </svg>
  </div>
</body>
</html>
