<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product milestones · Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Diagram Design</p>
    <h1>Product launch · fourteen months</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timeline-title timeline-desc">
      <title id="timeline-title">Product launch · fourteen months</title>
      <desc id="timeline-desc">Timeline showing product milestones from the first post in February 2025 through three design versions and the schematic skill in April 2026.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Year markers (background) -->
        <text x="60" y="340" fill="color-mix(in srgb, var(--dd-ink) 6%, transparent)" font-size="72" font-weight="600" font-family="'Geist Mono', monospace">2025</text>
        <text x="700" y="340" fill="color-mix(in srgb, var(--dd-ink) 6%, transparent)" font-size="72" font-weight="600" font-family="'Geist Mono', monospace">2026</text>

        <!-- Baseline -->
        <line x1="80" y1="240" x2="920" y2="240" stroke="color-mix(in srgb, var(--dd-muted) 45%, transparent)" stroke-width="1"/>

        <!-- Year boundary tick (between 2025 and 2026) -->
        <line x1="680" y1="232" x2="680" y2="248" stroke="var(--dd-wash-20)" stroke-width="1"/>
        <text x="680" y="260" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">JAN '26</text>

        <!-- Start / end caps -->
        <line x1="80" y1="232" x2="80" y2="248" stroke="var(--dd-wash-20)" stroke-width="1"/>
        <line x1="920" y1="232" x2="920" y2="248" stroke="var(--dd-wash-20)" stroke-width="1"/>

        <!-- Event 1: FEB 2025 · First post (below) -->
        <line x1="100" y1="240" x2="100" y2="296" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <circle cx="100" cy="240" r="4" fill="var(--dd-ink)"/>
        <text x="100" y="312" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FEB 2025</text>
        <text x="100" y="328" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">First post</text>

        <!-- Event 2: APR 2025 · Design v1 (above) -->
        <line x1="240" y1="184" x2="240" y2="240" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <circle cx="240" cy="240" r="4" fill="var(--dd-ink)"/>
        <text x="240" y="156" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APR 2025</text>
        <text x="240" y="172" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Design v1</text>

        <!-- Event 3: SEP 2025 · Design v2 (below) -->
        <line x1="500" y1="240" x2="500" y2="296" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <circle cx="500" cy="240" r="4" fill="var(--dd-ink)"/>
        <text x="500" y="312" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SEP 2025</text>
        <text x="500" y="328" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Design v2</text>
        <text x="500" y="344" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">typography pass</text>

        <!-- Event 4: JAN 2026 · Design v3 (above, gold major) -->
        <line x1="740" y1="160" x2="740" y2="240" stroke="var(--dd-accent)" stroke-width="1"/>
        <circle cx="740" cy="240" r="6" fill="var(--dd-accent)"/>
        <text x="740" y="128" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">JAN 2026</text>
        <text x="740" y="148" fill="var(--dd-ink)" font-size="14" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Design v3</text>
        <text x="740" y="164" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">complexity budget</text>

        <!-- Event 5: APR 2026 · now · Diagram Design skill (below, gold) -->
        <line x1="900" y1="240" x2="900" y2="296" stroke="var(--dd-accent)" stroke-width="1"/>
        <circle cx="900" cy="240" r="6" fill="var(--dd-accent)"/>
        <text x="900" y="312" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APR 2026 · NOW</text>
        <text x="900" y="328" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Schematic skill</text>
        <text x="900" y="344" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eight diagram types</text>

        <!-- Legend -->
        <line x1="40" y1="376" x2="960" y2="376" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="392" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="408" r="4" fill="var(--dd-ink)"/>
        <text x="68" y="412" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Event</text>

        <circle cx="148" cy="408" r="6" fill="var(--dd-accent)"/>
        <text x="164" y="412" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Major milestone</text>

        <text x="296" y="412" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif" font-style="italic">Spacing is proportional to real elapsed time.</text>
      </svg>
  </div>
</body>
</html>
