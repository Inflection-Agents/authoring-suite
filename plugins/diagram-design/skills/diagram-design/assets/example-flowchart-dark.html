<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Should you write this as a skill?</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Should you write this as a skill?</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-dark-title flowchart-dark-desc">
      <title id="flowchart-dark-title">Should you write this as a skill?</title>
      <desc id="flowchart-dark-desc">Flowchart showing when a new workflow should stay manual, become a project note, or be written as a reusable skill.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start → Step -->
        <line x1="500" y1="88" x2="500" y2="120" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step → Diamond 1 -->
        <line x1="500" y1="168" x2="500" y2="192" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "NO" right -->
        <line x1="600" y1="240" x2="720" y2="240" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "YES" down -->
        <line x1="500" y1="288" x2="500" y2="328" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "NO" right -->
        <line x1="600" y1="376" x2="720" y2="376" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "YES" down (gold — happy path) -->
        <line x1="500" y1="424" x2="500" y2="464" stroke="var(--dd-accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="644" y="230" width="24" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="656" y="239" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="298" width="32" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="500" y="307" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="644" y="366" width="24" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="656" y="375" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="434" width="32" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="500" y="443" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <!-- Start oval -->
        <rect x="420" y="40" width="160" height="48" rx="24" fill="var(--dd-wash-3)" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <text x="500" y="68" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">New workflow</text>

        <!-- Rectangle: Step -->
        <rect x="420" y="120" width="160" height="48" rx="6" class="dd-node" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
        <text x="500" y="148" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Do it manually once</text>

        <!-- Diamond 1: Repeated >3 times? -->
        <polygon points="500,192 600,240 500,288 400,240" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
        <text x="500" y="238" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Will you repeat</text>
        <text x="500" y="252" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">it >3 times?</text>

        <!-- End oval: One-off -->
        <rect x="720" y="216" width="160" height="48" rx="24" fill="var(--dd-wash-3)" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <text x="800" y="240" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">One-off</text>
        <text x="800" y="254" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keep manual</text>

        <!-- Diamond 2: Reusable across projects? -->
        <polygon points="500,328 600,376 500,424 400,376" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
        <text x="500" y="374" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Reusable across</text>
        <text x="500" y="388" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">projects?</text>

        <!-- End oval: CLAUDE.md note -->
        <rect x="720" y="352" width="160" height="48" rx="24" fill="var(--dd-wash-3)" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <text x="800" y="376" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">CLAUDE.md note</text>
        <text x="800" y="390" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">project-scoped</text>

        <!-- End oval: Write a skill (gold focal) -->
        <rect x="420" y="464" width="160" height="56" rx="28" fill="color-mix(in srgb, var(--dd-accent) 8%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
        <text x="500" y="492" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Write a skill</text>
        <text x="500" y="508" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reusable + assets</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="960" y2="540" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="556" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="572" width="24" height="12" rx="6" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <text x="72" y="582" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Start / end (oval)</text>

        <rect x="220" y="572" width="24" height="12" rx="2" class="dd-tag" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
        <text x="252" y="582" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Step (rectangle)</text>

        <polygon points="412,578 424,572 436,578 424,584" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
        <text x="448" y="582" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Decision (diamond)</text>

        <line x1="604" y1="580" x2="632" y2="580" stroke="var(--dd-accent)" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="640" y="582" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Happy path</text>

        <line x1="768" y1="580" x2="796" y2="580" stroke="var(--dd-muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="804" y="582" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Branch</text>
      </svg>
  </div>
</body>
</html>
