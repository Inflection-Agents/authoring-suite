<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 product launch · Gantt · dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans',system-ui,sans-serif;
      --font-serif: 'Cormorant Garamond',serif;
      --font-mono: 'Geist Mono',ui-monospace,monospace;
    }
    body { font-family: var(--font-sans); background: var(--dd-paper); color: var(--dd-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dd-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Gantt · Diagram Design</p>
    <h1>Q2 product launch · 12-week plan</h1>

    <!-- viewBox 0 0 1000 500. Timeline x=200-956 = 756px / 12 weeks = 63px per week -->
    <!-- Rows: label col x=20-196, timeline x=200-956 -->
    <!-- Row height=40, bar h=24, bar top pad=8 -->
    <!-- Week x = 200 + i*63, i=0..12 -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gantt-dark-title gantt-dark-desc">
      <title id="gantt-dark-title">Q2 product launch · 12-week plan</title>
      <desc id="gantt-dark-desc">Gantt chart showing a twelve-week product launch from market research and interviews through design review, development, beta testing, and launch.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-paper) 10%, transparent)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Phase zones (drawn before everything) -->
      <!-- Phase 1 DISCOVERY: rows y=84,124 → zone y=72, h=84 -->
      <rect x="12" y="72" width="976" height="84" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-paper) 3%, transparent)" stroke="color-mix(in srgb, var(--dd-paper) 10%, transparent)" stroke-width="0.8"/>
      <!-- Phase 2 DESIGN: rows y=184,224,264 → zone y=172, h=120 -->
      <rect x="12" y="172" width="976" height="120" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-paper) 3%, transparent)" stroke="color-mix(in srgb, var(--dd-paper) 10%, transparent)" stroke-width="0.8"/>
      <!-- Phase 3 LAUNCH: rows y=324,364 → zone y=312, h=88 -->
      <rect x="12" y="312" width="976" height="88" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-paper) 3%, transparent)" stroke="color-mix(in srgb, var(--dd-paper) 10%, transparent)" stroke-width="0.8"/>

      <!-- Month headers at y=40-56 -->
      <text x="326" y="52" fill="var(--dd-paper)" font-size="9" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">April</text>
      <text x="578" y="52" fill="var(--dd-paper)" font-size="9" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">May</text>
      <text x="830" y="52" fill="var(--dd-paper)" font-size="9" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">June</text>

      <!-- Month separator lines -->
      <line x1="452" y1="36" x2="452" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 8%, transparent)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="704" y1="36" x2="704" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 8%, transparent)" stroke-width="0.8" stroke-dasharray="3,3"/>

      <!-- Week gridlines (vertical, hairline) -->
      <line x1="263" y1="60" x2="263" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="326" y1="60" x2="326" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="389" y1="60" x2="389" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="515" y1="60" x2="515" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="578" y1="60" x2="578" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="641" y1="60" x2="641" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="767" y1="60" x2="767" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="830" y1="60" x2="830" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>
      <line x1="893" y1="60" x2="893" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 5%, transparent)" stroke-width="0.6"/>

      <!-- Timeline header line -->
      <line x1="200" y1="60" x2="956" y2="60" stroke="color-mix(in srgb, var(--dd-paper) 15%, transparent)" stroke-width="0.8"/>
      <!-- Left divider -->
      <line x1="200" y1="36" x2="200" y2="416" stroke="color-mix(in srgb, var(--dd-paper) 15%, transparent)" stroke-width="0.8"/>

      <!-- Phase labels (eyebrow style) -->
      <text x="20" y="85" fill="color-mix(in srgb, var(--dd-paper) 35%, transparent)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DISCOVERY</text>
      <text x="20" y="185" fill="color-mix(in srgb, var(--dd-paper) 35%, transparent)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DESIGN</text>
      <text x="20" y="325" fill="color-mix(in srgb, var(--dd-paper) 35%, transparent)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAUNCH</text>

      <!-- ─── TASK BARS ─── -->
      <!-- W_x = 200 + week_index * 63 -->
      <!-- Row 1 y=84: Market research W1-W3 (i=0..2, x=200, dur=2*63=126) -->
      <rect x="20"  y="92" width="176" height="24" fill="var(--dd-paper)"/>
      <text x="20"  y="108" fill="var(--dd-paper)" font-size="10" font-weight="600" font-family="'DM Sans', sans-serif">Market research</text>
      <rect x="200" y="92" width="126" height="24" rx="4" fill="var(--dd-paper)"/>
      <rect x="200" y="92" width="126" height="24" rx="4" fill="color-mix(in srgb, var(--dd-rule-solid) 15%, transparent)" stroke="var(--dd-rule-solid)" stroke-width="1"/>

      <!-- Row 2 y=124: User interviews W2-W4 (i=1..3, x=263, dur=2*63=126) -->
      <rect x="20"  y="132" width="176" height="24" fill="var(--dd-paper)"/>
      <text x="20"  y="148" fill="var(--dd-paper)" font-size="10" font-weight="600" font-family="'DM Sans', sans-serif">User interviews</text>
      <rect x="263" y="132" width="126" height="24" rx="4" fill="var(--dd-paper)"/>
      <rect x="263" y="132" width="126" height="24" rx="4" fill="color-mix(in srgb, var(--dd-rule-solid) 15%, transparent)" stroke="var(--dd-rule-solid)" stroke-width="1"/>

      <!-- Row 3 y=184: Wireframes W4-W6 (i=3..5, x=389, dur=2*63=126) -->
      <rect x="20"  y="192" width="176" height="24" fill="var(--dd-paper)"/>
      <text x="20"  y="208" fill="var(--dd-paper)" font-size="10" font-weight="600" font-family="'DM Sans', sans-serif">Wireframes</text>
      <rect x="389" y="192" width="126" height="24" rx="4" fill="var(--dd-paper)"/>
      <rect x="389" y="192" width="126" height="24" rx="4" fill="color-mix(in srgb, var(--dd-rule-solid) 15%, transparent)" stroke="var(--dd-rule-solid)" stroke-width="1"/>

      <!-- Row 4 y=224: Prototype W5-W8 (i=4..7, x=452, dur=3*63=189) -->
      <rect x="20"  y="232" width="176" height="24" fill="var(--dd-paper)"/>
      <text x="20"  y="248" fill="var(--dd-paper)" font-size="10" font-weight="600" font-family="'DM Sans', sans-serif">Prototype</text>
      <rect x="452" y="232" width="189" height="24" rx="4" fill="var(--dd-paper)"/>
      <rect x="452" y="232" width="189" height="24" rx="4" fill="color-mix(in srgb, var(--dd-rule-solid) 15%, transparent)" stroke="var(--dd-rule-solid)" stroke-width="1"/>

      <!-- Row 5 y=264 FOCAL: Design review W8-W9 (i=7..8, x=641, dur=63) -->
      <rect x="20"  y="272" width="176" height="24" fill="var(--dd-paper)"/>
      <text x="20"  y="288" fill="var(--dd-accent)" font-size="10" font-weight="600" font-family="'DM Sans', sans-serif">Design review</text>
      <rect x="641" y="272" width="63" height="24" rx="4" fill="var(--dd-paper)"/>
      <rect x="641" y="272" width="63" height="24" rx="4" fill="color-mix(in srgb, var(--dd-accent) 14%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
      <text x="672" y="289" fill="var(--dd-accent)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GATE</text>

      <!-- Row 6 y=324: Development W7-W11 (i=6..10, x=578, dur=4*63=252) -->
      <rect x="20"  y="332" width="176" height="24" fill="var(--dd-paper)"/>
      <text x="20"  y="348" fill="var(--dd-paper)" font-size="10" font-weight="600" font-family="'DM Sans', sans-serif">Development</text>
      <rect x="578" y="332" width="252" height="24" rx="4" fill="var(--dd-paper)"/>
      <rect x="578" y="332" width="252" height="24" rx="4" fill="color-mix(in srgb, var(--dd-rule-solid) 15%, transparent)" stroke="var(--dd-rule-solid)" stroke-width="1"/>

      <!-- Row 7 y=364: Beta testing W10-W12 (i=9..11, x=767, dur=2*63=126) -->
      <rect x="20"  y="372" width="176" height="24" fill="var(--dd-paper)"/>
      <text x="20"  y="388" fill="var(--dd-paper)" font-size="10" font-weight="600" font-family="'DM Sans', sans-serif">Beta testing</text>
      <rect x="767" y="372" width="126" height="24" rx="4" fill="var(--dd-paper)"/>
      <rect x="767" y="372" width="126" height="24" rx="4" fill="color-mix(in srgb, var(--dd-rule-solid) 15%, transparent)" stroke="var(--dd-rule-solid)" stroke-width="1"/>

      <!-- Legend -->
      <line x1="40" y1="430" x2="960" y2="430" stroke="color-mix(in srgb, var(--dd-paper) 10%, transparent)" stroke-width="0.8"/>
      <text x="40" y="446" fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="456" width="20" height="12" rx="3" fill="color-mix(in srgb, var(--dd-accent) 14%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
      <text x="68" y="466" fill="var(--dd-rule-solid)" font-size="8.5" font-family="'DM Sans', sans-serif">Design review · critical gate</text>

      <rect x="280" y="456" width="20" height="12" rx="3" fill="color-mix(in srgb, var(--dd-rule-solid) 15%, transparent)" stroke="var(--dd-rule-solid)" stroke-width="1"/>
      <text x="308" y="466" fill="var(--dd-rule-solid)" font-size="8.5" font-family="'DM Sans', sans-serif">Task</text>

      <rect x="368" y="456" width="20" height="12" rx="3" fill="color-mix(in srgb, var(--dd-paper) 3%, transparent)" stroke="color-mix(in srgb, var(--dd-paper) 10%, transparent)" stroke-width="0.8"/>
      <text x="396" y="466" fill="var(--dd-rule-solid)" font-size="8.5" font-family="'DM Sans', sans-serif">Phase</text>
    </svg>
  </div>
</body>
</html>
