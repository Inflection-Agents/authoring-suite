<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production · deployment topology</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Diagram Design</p>
    <h1>Production · deployment topology</h1>

    <svg viewBox="0 0 960 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc">
      <title id="deployment-title">Production deployment topology in AWS eu-west-1</title>
      <desc id="deployment-desc">Route 53, outside the region, routes to an ALB fronting two availability zones. Each zone runs an ECS cluster hosting 3 API instances and 2 Worker instances. A Postgres primary in zone A replicates to a read replica in zone B.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
        </pattern>
        <marker id="arr-link" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="var(--dd-link)"/>
        </marker>
        <marker id="arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="var(--dd-muted)"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="24" fill="var(--dd-ink)" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.16em">ENVIRONMENT · PRODUCTION</text>

      <!-- Route 53: outside the region boundary -->
      <path d="M 402,40 H 552 L 560,48 V 96 L 552,104 H 402 A 2,2 0 0 1 400,102 V 42 A 2,2 0 0 1 402,40 Z" fill="var(--dd-paper)"/>
      <path d="M 402,40 H 552 L 560,48 V 96 L 552,104 H 402 A 2,2 0 0 1 400,102 V 42 A 2,2 0 0 1 402,40 Z" fill="color-mix(in srgb, var(--dd-ink) 3%, transparent)" stroke="color-mix(in srgb, var(--dd-ink) 30%, transparent)" stroke-width="1"/>
      <text x="416" y="56" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INFRA</text>
      <text x="416" y="76" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Route 53</text>
      <text x="416" y="92" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">global DNS</text>

      <line x1="480" y1="104" x2="480" y2="176" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>

      <!-- Region: deployment node, dashed transparent boundary -->
      <rect x="40" y="144" width="880" height="400" rx="8" class="dd-container" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 18%, transparent)" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="56" y="164" fill="var(--dd-muted)" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">AWS · EU-WEST-1</text>

      <!-- ALB: infrastructure node, region-level, fronts both zones -->
      <path d="M 402,176 H 552 L 560,184 V 232 L 552,240 H 402 A 2,2 0 0 1 400,238 V 178 A 2,2 0 0 1 402,176 Z" fill="var(--dd-paper)"/>
      <path d="M 402,176 H 552 L 560,184 V 232 L 552,240 H 402 A 2,2 0 0 1 400,238 V 178 A 2,2 0 0 1 402,176 Z" fill="color-mix(in srgb, var(--dd-ink) 3%, transparent)" stroke="color-mix(in srgb, var(--dd-ink) 30%, transparent)" stroke-width="1"/>
      <text x="416" y="192" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INFRA</text>
      <text x="416" y="212" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">ALB</text>
      <text x="416" y="228" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">round-robin · :443</text>

      <path d="M480,240 V244 Q480,252 472,252 H272 Q264,252 264,260 V264" fill="none" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <path d="M480,240 V244 Q480,252 488,252 H688 Q696,252 696,260 V264" fill="none" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>

      <!-- Zone A: deployment node -->
      <rect x="64" y="264" width="400" height="256" rx="8" class="dd-container" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 18%, transparent)" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="80" y="284" fill="var(--dd-muted)" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">AVAILABILITY ZONE A</text>

      <!-- Zone B: deployment node -->
      <rect x="496" y="264" width="400" height="256" rx="8" class="dd-container" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 18%, transparent)" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="512" y="284" fill="var(--dd-muted)" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">AVAILABILITY ZONE B</text>

      <!-- Cluster A: deployment node -->
      <rect x="88" y="296" width="352" height="112" rx="8" class="dd-container" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 18%, transparent)" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="104" y="316" fill="var(--dd-muted)" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ECS CLUSTER</text>

      <!-- Cluster B: deployment node -->
      <rect x="520" y="296" width="352" height="112" rx="8" class="dd-container" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 18%, transparent)" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="536" y="316" fill="var(--dd-muted)" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ECS CLUSTER</text>

      <!-- API-A: container instance, plain, ×3 -->
      <rect x="112" y="328" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="128" y="344" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INSTANCE</text>
      <text x="128" y="364" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">API</text>
      <text x="128" y="380" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">node · :3000</text>
      <rect x="236" y="320" width="32" height="16" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="252" y="332" fill="var(--dd-ink)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">×3</text>

      <!-- Worker-A: container instance, plain, ×2 -->
      <rect x="276" y="328" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="292" y="344" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INSTANCE</text>
      <text x="292" y="364" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Worker</text>
      <text x="292" y="380" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">queue consumer</text>
      <rect x="400" y="320" width="32" height="16" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="416" y="332" fill="var(--dd-ink)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">×2</text>

      <!-- API-B: container instance, plain, ×3 -->
      <rect x="544" y="328" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="560" y="344" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INSTANCE</text>
      <text x="560" y="364" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">API</text>
      <text x="560" y="380" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">node · :3000</text>
      <rect x="668" y="320" width="32" height="16" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="684" y="332" fill="var(--dd-ink)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">×3</text>

      <!-- Worker-B: container instance, plain, ×2 -->
      <rect x="708" y="328" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="724" y="344" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INSTANCE</text>
      <text x="724" y="364" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Worker</text>
      <text x="724" y="380" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">queue consumer</text>
      <rect x="832" y="320" width="32" height="16" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="848" y="332" fill="var(--dd-ink)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">×2</text>

      <!-- Cross-zone replication -->
      <line x1="332" y1="464" x2="624" y2="464" stroke="var(--dd-link)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-link)"/>
      <rect x="440" y="456" width="80" height="16" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
      <text x="480" y="468" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLICATES</text>

      <!-- PG-primary: container instance, store (1 notch), focal -->
      <path d="M 194,432 H 324 L 332,440 V 494 A 2,2 0 0 1 330,496 H 194 A 2,2 0 0 1 192,494 V 434 A 2,2 0 0 1 194,432 Z" fill="var(--dd-paper)"/>
      <path d="M 194,432 H 324 L 332,440 V 494 A 2,2 0 0 1 330,496 H 194 A 2,2 0 0 1 192,494 V 434 A 2,2 0 0 1 194,432 Z" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <text x="208" y="448" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INSTANCE · FOCAL</text>
      <text x="208" y="468" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Postgres</text>
      <text x="208" y="484" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">primary</text>

      <!-- PG-replica: container instance, store (1 notch), focal -->
      <path d="M 626,432 H 756 L 764,440 V 494 A 2,2 0 0 1 762,496 H 626 A 2,2 0 0 1 624,494 V 434 A 2,2 0 0 1 626,432 Z" fill="var(--dd-paper)"/>
      <path d="M 626,432 H 756 L 764,440 V 494 A 2,2 0 0 1 762,496 H 626 A 2,2 0 0 1 624,494 V 434 A 2,2 0 0 1 626,432 Z" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <text x="640" y="448" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">INSTANCE · FOCAL</text>
      <text x="640" y="468" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Postgres</text>
      <text x="640" y="484" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">replica · read-only</text>

      <!-- Legend -->
      <line x1="40" y1="568" x2="920" y2="568" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="40" y="584" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="180" y="592" width="24" height="16" rx="2" fill="transparent" stroke="color-mix(in srgb, var(--dd-ink) 30%, transparent)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="212" y="600" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Deployment node — region · zone · cluster</text>

      <rect x="464" y="592" width="24" height="16" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="496" y="600" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Container instance</text>

      <rect x="640" y="592" width="24" height="16" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-ink) 3%, transparent)" stroke="color-mix(in srgb, var(--dd-ink) 30%, transparent)" stroke-width="1"/>
      <text x="672" y="600" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Infrastructure — notched corner</text>

      <text x="848" y="600" fill="var(--dd-ink)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">×N</text>
      <text x="872" y="600" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Replica count</text>
    </svg>
  </div>
</body>
</html>
