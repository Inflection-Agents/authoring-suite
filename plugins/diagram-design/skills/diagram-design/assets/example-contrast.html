<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product platform · before / after</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Contrast · Diagram Design</p>
    <h1>Product platform · before / after</h1>

    <svg viewBox="0 0 1000 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contrast-title contrast-desc">
      <title id="contrast-title">Product platform, before and after sharing a platform core</title>
      <desc id="contrast-desc">Today, three product teams each run their own Auth, Billing, and Audit services. Proposed, the same three teams consume one shared Platform Core instead.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
        </pattern>
        <marker id="arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="var(--dd-muted)"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Divider -->
      <line x1="500" y1="40" x2="500" y2="304" stroke="var(--dd-rule-solid)" stroke-width="1"/>

      <!-- Panel state labels — neutral, not judgements -->
      <text x="60" y="56" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TODAY</text>
      <line x1="40" y1="64" x2="480" y2="64" stroke="var(--dd-rule)" stroke-width="0.8"/>
      <text x="540" y="56" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PROPOSED</text>
      <line x1="520" y1="64" x2="960" y2="64" stroke="var(--dd-rule)" stroke-width="0.8"/>

      <!-- TODAY: three teams, each owning its own stack — no connectors needed,
           ownership is implied by column layout alone. -->
      <rect x="60" y="80" width="120" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="120" y="96" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Team A</text>
      <rect x="200" y="80" width="120" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="260" y="96" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Team B</text>
      <rect x="340" y="80" width="120" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="400" y="96" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Team C</text>

      <rect x="60" y="128" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="76" y="140" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="76" y="160" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Auth</text>
      <rect x="60" y="192" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="76" y="204" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="76" y="224" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Billing</text>
      <rect x="60" y="256" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="76" y="268" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="76" y="288" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Audit</text>

      <rect x="200" y="128" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="216" y="140" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="216" y="160" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Auth</text>
      <rect x="200" y="192" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="216" y="204" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="216" y="224" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Billing</text>
      <rect x="200" y="256" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="216" y="268" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="216" y="288" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Audit</text>

      <rect x="340" y="128" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="356" y="140" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="356" y="160" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Auth</text>
      <rect x="340" y="192" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="356" y="204" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="356" y="224" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Billing</text>
      <rect x="340" y="256" width="120" height="48" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="356" y="268" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">SVC</text>
      <text x="356" y="288" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Audit</text>

      <!-- PROPOSED: same three teams, same column positions — now consuming one
           shared core instead of owning their own stack. The single difference. -->
      <rect x="540" y="80" width="120" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="600" y="96" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Team A</text>
      <rect x="680" y="80" width="120" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="740" y="96" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Team B</text>
      <rect x="820" y="80" width="120" height="24" rx="4" class="dd-node" fill="var(--dd-wash-3)" stroke="var(--dd-soft)" stroke-width="0.8"/>
      <text x="880" y="96" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Team C</text>

      <line x1="600" y1="104" x2="600" y2="128" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="740" y1="104" x2="740" y2="128" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <line x1="880" y1="104" x2="880" y2="128" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>

      <rect x="540" y="128" width="400" height="176" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <text x="556" y="144" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SVC · FOCAL</text>
      <text x="556" y="168" fill="var(--dd-ink)" font-size="16" font-weight="600" font-family="'DM Sans', sans-serif">Platform Core</text>
      <text x="556" y="188" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace">auth · billing · audit</text>
    </svg>
  </div>
</body>
</html>
