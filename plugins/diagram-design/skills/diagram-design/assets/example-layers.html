<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI app stack · Layer hierarchy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>AI app stack · Where the work actually happens</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
      <title id="layers-title">AI app stack · Where the work actually happens</title>
      <desc id="layers-desc">Layer stack showing model weights, SDK, prompts, agent harness, and UI surface, with the agent harness highlighted as the focal layer.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Direction column (left margin) -->
        <text x="60" y="68" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ABSTRACTION</text>
        <line x1="80" y1="80" x2="80" y2="400" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="var(--dd-muted)"/>
        <text x="60" y="416" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SILICON</text>

        <!-- Stack container hairlines (top + bottom edges) -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="var(--dd-rule)" stroke-width="1"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="var(--dd-rule)" stroke-width="1"/>

        <!-- L5 — UI (top layer, near-white fill) -->
        <rect x="120" y="80" width="840" height="64" fill="var(--dd-node-white)"/>
        <line x1="120" y1="144" x2="960" y2="144" stroke="var(--dd-rule)" stroke-width="1"/>
        <text x="140" y="116" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
        <text x="260" y="118" fill="var(--dd-ink)" font-size="16" font-weight="600" font-family="'DM Sans', sans-serif">UI surface</text>
        <text x="940" y="118" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">chat, editor, canvas</text>

        <!-- L4 — Agent harness (FOCAL, gold tint + gold stroke) -->
        <rect x="120" y="144" width="840" height="64" fill="var(--dd-accent-tint)"/>
        <rect x="120" y="144" width="840" height="64" fill="none" stroke="var(--dd-accent)" stroke-width="1"/>
        <text x="140" y="180" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L4</text>
        <text x="260" y="182" fill="var(--dd-ink)" font-size="16" font-weight="600" font-family="'DM Sans', sans-serif">Agent harness</text>
        <text x="940" y="182" fill="var(--dd-accent)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">tools, memory, loop</text>

        <!-- L3 — Prompt layer -->
        <rect x="120" y="208" width="840" height="64" fill="var(--dd-paper)"/>
        <line x1="120" y1="272" x2="960" y2="272" stroke="var(--dd-rule)" stroke-width="1"/>
        <text x="140" y="244" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
        <text x="260" y="246" fill="var(--dd-ink)" font-size="16" font-weight="600" font-family="'DM Sans', sans-serif">Prompt layer</text>
        <text x="940" y="246" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">system, few-shot, caching</text>

        <!-- L2 — SDK -->
        <rect x="120" y="272" width="840" height="64" fill="var(--dd-paper-2)"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="var(--dd-rule)" stroke-width="1"/>
        <text x="140" y="308" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="260" y="310" fill="var(--dd-ink)" font-size="16" font-weight="600" font-family="'DM Sans', sans-serif">SDK / client</text>
        <text x="940" y="310" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">auth, retries, streaming</text>

        <!-- L1 — Model -->
        <rect x="120" y="336" width="840" height="64" fill="var(--dd-paper-2)"/>
        <text x="140" y="372" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
        <text x="260" y="374" fill="var(--dd-ink)" font-size="16" font-weight="600" font-family="'DM Sans', sans-serif">Model weights</text>
        <text x="940" y="374" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">opus, sonnet, haiku</text>

        <!-- Caption -->
        <text x="120" y="456" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
        <text x="240" y="456" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif" font-style="italic">The harness is where most product differentiation actually lives — tools, memory, and the loop that stitches model calls into useful work.</text>
      </svg>
  </div>
</body>
</html>
