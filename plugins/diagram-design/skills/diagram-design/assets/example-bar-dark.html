<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint velocity · Bar chart · dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--dd-paper); color: var(--dd-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dd-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · Diagram Design</p>
    <h1>Sprint velocity · 8-sprint view</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bar-dark-title bar-dark-desc">
      <title id="bar-dark-title">Sprint velocity · 8-sprint view</title>
      <desc id="bar-dark-desc">Bar chart showing story points delivered across sprints S1 through S8, with Sprint 5 as the record high.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-ink)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="var(--dd-muted)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">STORY POINTS</text>

      <!-- Horizontal gridlines (drawn before bars) -->
      <line x1="80" y1="357" x2="960" y2="357" stroke="color-mix(in srgb, var(--dd-ink) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="293" x2="960" y2="293" stroke="color-mix(in srgb, var(--dd-ink) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="color-mix(in srgb, var(--dd-ink) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="167" x2="960" y2="167" stroke="color-mix(in srgb, var(--dd-ink) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="103" x2="960" y2="103" stroke="color-mix(in srgb, var(--dd-ink) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="color-mix(in srgb, var(--dd-ink) 6%, transparent)" stroke-width="0.8"/>

      <!-- Y-axis line and X-axis baseline -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="var(--dd-wash-20)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="var(--dd-wash-20)" stroke-width="1"/>

      <!-- Y-axis tick labels -->
      <text x="72" y="361" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20</text>
      <text x="72" y="297" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40</text>
      <text x="72" y="234" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">60</text>
      <text x="72" y="171" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80</text>
      <text x="72" y="107" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">100</text>
      <text x="72" y="44"  fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">120</text>

      <!-- ─── BARS (pitch=110, width=72, pad=19) ─── -->
      <!-- S1: v=72, h=228, y=192 -->
      <rect x="99" y="192" width="72" height="228" fill="var(--dd-ink)"/>
      <rect x="99" y="192" width="72" height="228" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="135" y="184" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">72</text>

      <!-- S2: v=88, h=280, y=140 -->
      <rect x="209" y="140" width="72" height="280" fill="var(--dd-ink)"/>
      <rect x="209" y="140" width="72" height="280" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="245" y="132" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">88</text>

      <!-- S3: v=95, h=300, y=120 -->
      <rect x="319" y="120" width="72" height="300" fill="var(--dd-ink)"/>
      <rect x="319" y="120" width="72" height="300" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="355" y="112" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">95</text>

      <!-- S4: v=78, h=248, y=172 -->
      <rect x="429" y="172" width="72" height="248" fill="var(--dd-ink)"/>
      <rect x="429" y="172" width="72" height="248" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="465" y="164" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">78</text>

      <!-- S5 FOCAL: v=110, h=348, y=72 -->
      <rect x="539" y="72" width="72" height="348" fill="var(--dd-ink)"/>
      <rect x="539" y="72" width="72" height="348" fill="color-mix(in srgb, var(--dd-accent) 14%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
      <text x="575" y="64" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">110</text>

      <!-- S6: v=102, h=324, y=96 -->
      <rect x="649" y="96" width="72" height="324" fill="var(--dd-ink)"/>
      <rect x="649" y="96" width="72" height="324" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="685" y="88" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">102</text>

      <!-- S7: v=85, h=268, y=152 -->
      <rect x="759" y="152" width="72" height="268" fill="var(--dd-ink)"/>
      <rect x="759" y="152" width="72" height="268" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="795" y="144" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">85</text>

      <!-- S8: v=93, h=296, y=124 -->
      <rect x="869" y="124" width="72" height="296" fill="var(--dd-ink)"/>
      <rect x="869" y="124" width="72" height="296" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="905" y="116" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">93</text>

      <!-- X-axis category labels -->
      <text x="135" y="440" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S1</text>
      <text x="245" y="440" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S2</text>
      <text x="355" y="440" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S3</text>
      <text x="465" y="440" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S4</text>
      <text x="575" y="440" fill="var(--dd-accent)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S5</text>
      <text x="685" y="440" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S6</text>
      <text x="795" y="440" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S7</text>
      <text x="905" y="440" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">S8</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="40" y="478" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="488" width="16" height="10" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-accent) 14%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
      <text x="64" y="497" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Sprint 5 · record high</text>

      <rect x="220" y="488" width="16" height="10" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-muted) 15%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="244" y="497" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Other sprints</text>
    </svg>
  </div>
</body>
</html>
