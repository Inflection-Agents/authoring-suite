<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certainty · assembled from the catalog (dark)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Composition · Diagram Design</p>
    <h1>Certainty · assembled from the catalog</h1>

    <svg viewBox="0 0 1040 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composition-dark-title composition-dark-desc">
      <title id="composition-dark-title">Certainty, assembled from the shared catalog</title>
      <desc id="composition-dark-desc">A catalog of six interchangeable parts. Certainty is assembled from three of them — ingest, engine, and ui — referenced by matching number, plus a bespoke Award rules component not in the catalog.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="56" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CATALOG — INTERCHANGEABLE PARTS</text>

      <!-- Catalog: six uniform parts, same size, same treatment -->
      <rect x="40" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="56" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">PART · CATALOG</text>
      <text x="56" y="116" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace">01 · auth</text>

      <rect x="204" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="220" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">PART · CATALOG</text>
      <text x="220" y="116" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace">02 · ingest</text>

      <rect x="368" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="384" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">PART · CATALOG</text>
      <text x="384" y="116" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace">03 · engine</text>

      <rect x="532" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="548" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">PART · CATALOG</text>
      <text x="548" y="116" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace">04 · ui</text>

      <rect x="696" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="712" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">PART · CATALOG</text>
      <text x="712" y="116" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace">05 · audit</text>

      <rect x="860" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="876" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">PART · CATALOG</text>
      <text x="876" y="116" fill="var(--dd-ink)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace">06 · notify</text>

      <!-- Assembly: no connectors back to the catalog — correspondence is the
           matching number, not a line. Four catalog parts drawing edges to one
           assembly would violate the no-overlap rule fast; this avoids it entirely. -->
      <rect x="260" y="184" width="520" height="184" rx="8" class="dd-container" fill="var(--dd-paper-2)" stroke="color-mix(in srgb, var(--dd-ink) 20%, transparent)" stroke-width="1"/>
      <text x="284" y="204" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CERTAINTY</text>

      <rect x="284" y="224" width="140" height="32" rx="4" fill="var(--dd-wash-3)" stroke="var(--dd-rule-solid)" stroke-width="0.8"/>
      <text x="352" y="244" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">02 · ingest</text>

      <rect x="448" y="224" width="140" height="32" rx="4" fill="var(--dd-wash-3)" stroke="var(--dd-rule-solid)" stroke-width="0.8"/>
      <text x="516" y="244" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">03 · engine</text>

      <rect x="612" y="224" width="140" height="32" rx="4" fill="var(--dd-wash-3)" stroke="var(--dd-rule-solid)" stroke-width="0.8"/>
      <text x="680" y="244" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">04 · ui</text>

      <rect x="420" y="280" width="200" height="64" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <text x="436" y="296" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">PART · BESPOKE</text>
      <text x="436" y="316" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif">Award rules</text>
      <text x="436" y="332" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace">not in the catalog</text>

      <!-- Legend -->
      <line x1="40" y1="384" x2="1000" y2="384" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="40" y="400" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="180" y="392" width="16" height="8" rx="2" class="dd-tag" fill="var(--dd-paper-2)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="204" y="400" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Catalog part</text>

      <rect x="320" y="392" width="16" height="8" rx="2" fill="var(--dd-wash-3)" stroke="var(--dd-rule-solid)" stroke-width="0.8"/>
      <text x="344" y="400" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Used here — same number as the catalog part</text>

      <rect x="640" y="392" width="16" height="8" rx="2" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
      <text x="664" y="400" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Bespoke — built for this assembly only</text>
    </svg>
  </div>
</body>
</html>
