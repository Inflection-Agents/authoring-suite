<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly signups · Line chart · dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans',system-ui,sans-serif;
      --font-serif: 'Cormorant Garamond',serif;
      --font-mono: 'Geist Mono',ui-monospace,monospace;
    }
    body { font-family: var(--font-sans); background: var(--dd-paper); color: var(--dd-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dd-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line · Diagram Design</p>
    <h1>Weekly signups · Organic leads the growth</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="line-dark-title line-dark-desc">
      <title id="line-dark-title">Weekly signups · Organic leads the growth</title>
      <desc id="line-dark-desc">Line chart showing weekly signups from organic, direct, and referral channels across weeks W1 through W8.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-paper) 10%, transparent)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="var(--dd-rule-solid)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">SIGNUPS / WEEK</text>

      <!-- Gridlines -->
      <line x1="80" y1="357" x2="960" y2="357" stroke="color-mix(in srgb, var(--dd-paper) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="293" x2="960" y2="293" stroke="color-mix(in srgb, var(--dd-paper) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="color-mix(in srgb, var(--dd-paper) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="167" x2="960" y2="167" stroke="color-mix(in srgb, var(--dd-paper) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="103" x2="960" y2="103" stroke="color-mix(in srgb, var(--dd-paper) 8%, transparent)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="color-mix(in srgb, var(--dd-paper) 6%, transparent)" stroke-width="0.8"/>

      <!-- Axes -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="color-mix(in srgb, var(--dd-paper) 20%, transparent)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="color-mix(in srgb, var(--dd-paper) 20%, transparent)" stroke-width="1"/>

      <!-- Y-axis labels -->
      <text x="72" y="361" fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40</text>
      <text x="72" y="297" fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80</text>
      <text x="72" y="234" fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">120</text>
      <text x="72" y="171" fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">160</text>
      <text x="72" y="107" fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">200</text>
      <text x="72" y="44"  fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">240</text>

      <!-- ─── SERIES (non-focal drawn first) ─── -->
      <!-- Referral: [45,52,48,60,55,68,62,75] series-2 dusty-blue -->
      <polyline points="80,349 200,338 320,344 440,325 560,333 680,312 800,322 920,301"
                fill="none" stroke="var(--dd-series-2)" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Direct: [80,82,88,90,86,92,95,98] series-1 sage -->
      <polyline points="80,293 200,290 320,281 440,278 560,284 680,274 800,270 920,265"
                fill="none" stroke="var(--dd-series-1)" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Organic FOCAL area fill (subtle) -->
      <polygon points="80,230 200,206 320,186 440,164 560,175 680,138 800,111 920,88 920,420 80,420"
               fill="color-mix(in srgb, var(--dd-accent) 8%, transparent)"/>

      <!-- Organic FOCAL line: [120,135,148,162,155,178,195,210] accent -->
      <polyline points="80,230 200,206 320,186 440,164 560,175 680,138 800,111 920,88"
                fill="none" stroke="var(--dd-accent)" stroke-width="1.8" stroke-linejoin="round"/>

      <!-- Focal vertex dots -->
      <circle cx="80"  cy="230" r="4" fill="var(--dd-accent)"/>
      <circle cx="200" cy="206" r="4" fill="var(--dd-accent)"/>
      <circle cx="320" cy="186" r="4" fill="var(--dd-accent)"/>
      <circle cx="440" cy="164" r="4" fill="var(--dd-accent)"/>
      <circle cx="560" cy="175" r="4" fill="var(--dd-accent)"/>
      <circle cx="680" cy="138" r="4" fill="var(--dd-accent)"/>
      <circle cx="800" cy="111" r="4" fill="var(--dd-accent)"/>
      <circle cx="920" cy="88"  r="4" fill="var(--dd-accent)"/>

      <!-- X-axis labels -->
      <text x="80"  y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W1</text>
      <text x="200" y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W2</text>
      <text x="320" y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W3</text>
      <text x="440" y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W4</text>
      <text x="560" y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W5</text>
      <text x="680" y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W6</text>
      <text x="800" y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W7</text>
      <text x="920" y="440" fill="var(--dd-rule-solid)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">W8</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="color-mix(in srgb, var(--dd-paper) 10%, transparent)" stroke-width="0.8"/>
      <text x="40" y="478" fill="var(--dd-rule-solid)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="492" x2="64" y2="492" stroke="var(--dd-accent)" stroke-width="1.8"/>
      <circle cx="52" cy="492" r="4" fill="var(--dd-accent)"/>
      <text x="72" y="496" fill="var(--dd-rule-solid)" font-size="8.5" font-family="'DM Sans', sans-serif">Organic · focal</text>

      <line x1="200" y1="492" x2="224" y2="492" stroke="var(--dd-series-1)" stroke-width="1.2"/>
      <text x="232" y="496" fill="var(--dd-rule-solid)" font-size="8.5" font-family="'DM Sans', sans-serif">Direct</text>

      <line x1="316" y1="492" x2="340" y2="492" stroke="var(--dd-series-2)" stroke-width="1.2"/>
      <text x="348" y="496" fill="var(--dd-rule-solid)" font-size="8.5" font-family="'DM Sans', sans-serif">Referral</text>
    </svg>
  </div>
</body>
</html>
