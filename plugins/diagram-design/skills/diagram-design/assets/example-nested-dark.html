<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The CLAUDE.md Hierarchy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #0F1A26;
      --dd-paper-2: #1B2B3C;
      --dd-node-white: #ffffff;
      --dd-ink: #F5F2EC;
      --dd-muted: #C8C4BB;
      --dd-soft: #A8BFCC;
      --dd-rule: rgba(245,242,236,0.14);
      --dd-rule-solid: rgba(200,196,187,0.25);
      --dd-accent: #D4B97A;
      --dd-accent-tint: rgba(212,185,122,0.10);
      --dd-link: #8FB0DC;
      --dd-series-1: #C8B483;
      --dd-series-2: #86949F;
      --dd-series-3: #A5C6AF;
      --dd-series-4: #D5A483;
      --dd-series-5: #9B90AD;
      --dd-wash-2: rgba(245,242,236,0.02);
      --dd-wash-3: rgba(245,242,236,0.03);
      --dd-wash-5: rgba(245,242,236,0.05);
      --dd-wash-10: rgba(200,196,187,0.10);
      --dd-wash-20: rgba(245,242,236,0.20);
      --dd-wash-30: rgba(245,242,236,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · Diagram Design</p>
    <h1>The CLAUDE.md Hierarchy</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nested-dark-title nested-dark-desc">
      <title id="nested-dark-title">The CLAUDE.md Hierarchy</title>
      <desc id="nested-dark-desc">Nested diagram showing how project CLAUDE.md instructions inherit broader scopes from the global, vault, business, and marketing levels.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Level 1: ~/.claude/ (global) — outermost -->
        <rect x="40" y="60" width="920" height="380" rx="8" class="dd-container" fill="color-mix(in srgb, var(--dd-ink) 1.5%, transparent)" stroke="var(--dd-wash-30)" stroke-width="1"/>
        <!-- Level 2: ~/vault/ -->
        <rect x="72" y="96" width="856" height="308" rx="8" class="dd-container" fill="var(--dd-wash-2)" stroke="color-mix(in srgb, var(--dd-ink) 35%, transparent)" stroke-width="1"/>
        <!-- Level 3: /business -->
        <rect x="104" y="132" width="792" height="236" rx="8" class="dd-container" fill="color-mix(in srgb, var(--dd-ink) 2.5%, transparent)" stroke="color-mix(in srgb, var(--dd-ink) 45%, transparent)" stroke-width="1"/>
        <!-- Level 4: /marketing -->
        <rect x="136" y="168" width="728" height="164" rx="8" class="dd-container" fill="var(--dd-wash-3)" stroke="var(--dd-muted)" stroke-width="1"/>
        <!-- Level 5: /project — innermost, gold focal -->
        <rect x="168" y="204" width="664" height="92" rx="8" class="dd-container" fill="color-mix(in srgb, var(--dd-accent) 8%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>

        <!-- Level labels on paper-colored masks -->
        <rect x="56" y="52" width="188" height="16" fill="var(--dd-paper)"/>
        <text x="64" y="64" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">~/.claude/ (global)</text>

        <rect x="88" y="88" width="148" height="16" fill="var(--dd-paper)"/>
        <text x="96" y="100" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">~/vault/ (notes)</text>

        <rect x="120" y="124" width="96" height="16" fill="var(--dd-paper)"/>
        <text x="128" y="136" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">/business</text>

        <rect x="152" y="160" width="108" height="16" fill="var(--dd-paper)"/>
        <text x="160" y="172" fill="var(--dd-ink)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">/marketing</text>

        <rect x="184" y="196" width="88" height="16" fill="var(--dd-paper)"/>
        <text x="192" y="208" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">/project</text>

        <!-- File-icon glyphs (simple rect with folded corner) inside each level -->
        <g transform="translate(908, 408)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="var(--dd-paper)" stroke="color-mix(in srgb, var(--dd-ink) 35%, transparent)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="color-mix(in srgb, var(--dd-ink) 35%, transparent)" stroke-width="1"/>
        </g>
        <g transform="translate(876, 372)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="var(--dd-paper)" stroke="color-mix(in srgb, var(--dd-ink) 40%, transparent)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="color-mix(in srgb, var(--dd-ink) 40%, transparent)" stroke-width="1"/>
        </g>
        <g transform="translate(844, 336)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="var(--dd-paper)" stroke="color-mix(in srgb, var(--dd-ink) 50%, transparent)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="color-mix(in srgb, var(--dd-ink) 50%, transparent)" stroke-width="1"/>
        </g>
        <g transform="translate(812, 300)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="var(--dd-paper)" stroke="var(--dd-muted)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>
        </g>

        <!-- Innermost label — human readable -->
        <text x="500" y="248" fill="var(--dd-ink)" font-size="16" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">CLAUDE.md</text>
        <text x="500" y="272" fill="var(--dd-muted)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">inherits every level above</text>

        <!-- Annotation top-right: italic callout with curved arrow -->
        <text x="904" y="36" fill="var(--dd-ink)" font-size="14" font-style="italic" font-family="'Cormorant Garamond', serif" text-anchor="end">no imports, no configuration</text>
        <path d="M 820 44 Q 700 84 520 216" fill="none" stroke="color-mix(in srgb, var(--dd-ink) 40%, transparent)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="520" cy="216" r="2" fill="var(--dd-ink)"/>

        <!-- Annotation bottom-left: italic callout -->
        <text x="40" y="484" fill="var(--dd-muted)" font-size="14" font-style="italic" font-family="'Cormorant Garamond', serif">structure IS the index</text>
      </svg>
  </div>
</body>
</html>
