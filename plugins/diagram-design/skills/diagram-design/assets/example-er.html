<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content platform · ER model</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · Diagram Design</p>
    <h1>Content platform · data model</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">Content platform · data model</title>
      <desc id="er-desc">Entity-relationship diagram showing authors writing articles and articles connecting to tags and categories.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="var(--dd-paper)"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationship lines (drawn first) -->
        <!-- 1. Author — Article (1:N "writes") -->
        <line x1="260" y1="240" x2="400" y2="240" stroke="var(--dd-muted)" stroke-width="1" />
        <!-- 2. Article — ArticleTag (1:N) -->
        <path d="M 640,320 H 702 Q 710,320 710,328 H 780" fill="none" stroke="var(--dd-muted)" stroke-width="1"/>
        <!-- 3. Tag — ArticleTag (1:N, vertical) -->
        <line x1="880" y1="248" x2="880" y2="280" stroke="var(--dd-muted)" stroke-width="1" />

        <!-- Cardinality labels -->
        <rect x="266" y="232" width="12" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="272" y="242" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="378" y="232" width="16" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="386" y="242" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="646" y="316" width="12" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="652" y="326" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="760" y="324" width="16" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="768" y="334" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="872" y="252" width="16" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="880" y="262" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="872" y="268" width="16" height="12" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="880" y="278" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

        <!-- Relationship labels -->
        <rect x="304" y="220" width="56" height="14" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="332" y="230" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WRITES</text>

        <rect x="688" y="300" width="56" height="14" rx="2" class="dd-tag" fill="var(--dd-paper)"/>
        <text x="716" y="310" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">TAGGED</text>

        <!-- Entity: Author -->
        <rect x="60" y="160" width="200" height="160" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
        <rect x="60" y="160" width="200" height="40" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="none"/>
        <rect x="60" y="192" width="200" height="8" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)"/>
        <line x1="60" y1="200" x2="260" y2="200" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1"/>
        <text x="76" y="176" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="76" y="192" fill="var(--dd-ink)" font-size="14" font-weight="600" font-family="'DM Sans', sans-serif">Author</text>
        <text x="76" y="220" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="220" y="220" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="76" y="240" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">handle</text>
        <text x="220" y="240" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="76" y="260" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">name</text>
        <text x="220" y="260" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="76" y="280" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">bio</text>
        <text x="220" y="280" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="76" y="300" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">site_url</text>
        <text x="220" y="300" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>

        <!-- Entity: Article (focal gold) -->
        <rect x="400" y="120" width="240" height="240" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-accent) 4%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
        <rect x="400" y="120" width="240" height="40" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-accent) 10%, transparent)" stroke="none"/>
        <rect x="400" y="152" width="240" height="8" fill="color-mix(in srgb, var(--dd-accent) 10%, transparent)"/>
        <line x1="400" y1="160" x2="640" y2="160" stroke="color-mix(in srgb, var(--dd-accent) 40%, transparent)" stroke-width="1"/>
        <text x="416" y="136" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="416" y="152" fill="var(--dd-ink)" font-size="14" font-weight="600" font-family="'DM Sans', sans-serif">Article</text>
        <text x="416" y="180" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="600" y="180" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="416" y="200" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">title</text>
        <text x="600" y="200" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="416" y="220" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">slug</text>
        <text x="600" y="220" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="416" y="240" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">body_mdx</text>
        <text x="600" y="240" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="416" y="260" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">published_at</text>
        <text x="600" y="260" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="416" y="280" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">→ author_id</text>
        <text x="600" y="280" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="416" y="300" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">status</text>
        <text x="600" y="300" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="416" y="320" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">og_image</text>
        <text x="600" y="320" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text · url</text>

        <!-- Entity: Tag -->
        <rect x="780" y="120" width="200" height="128" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
        <rect x="780" y="120" width="200" height="40" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="none"/>
        <rect x="780" y="152" width="200" height="8" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)"/>
        <line x1="780" y1="160" x2="980" y2="160" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1"/>
        <text x="796" y="136" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="796" y="152" fill="var(--dd-ink)" font-size="14" font-weight="600" font-family="'DM Sans', sans-serif">Tag</text>
        <text x="796" y="180" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="940" y="180" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="796" y="200" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">slug</text>
        <text x="940" y="200" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="796" y="220" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">name</text>
        <text x="940" y="220" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="796" y="240" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">description</text>
        <text x="940" y="240" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>

        <!-- Entity: ArticleTag (join) -->
        <rect x="780" y="280" width="200" height="96" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="780" y="280" width="200" height="40" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-ink) 6%, transparent)" stroke="none"/>
        <rect x="780" y="312" width="200" height="8" fill="color-mix(in srgb, var(--dd-ink) 6%, transparent)"/>
        <line x1="780" y1="320" x2="980" y2="320" stroke="color-mix(in srgb, var(--dd-ink) 22%, transparent)" stroke-width="1"/>
        <text x="796" y="296" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">JOIN</text>
        <text x="796" y="312" fill="var(--dd-ink)" font-size="14" font-weight="600" font-family="'DM Sans', sans-serif">ArticleTag</text>
        <text x="796" y="340" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">→ article_id</text>
        <text x="940" y="340" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="796" y="360" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace">→ tag_id</text>
        <text x="940" y="360" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

        <!-- Legend -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
        <text x="40" y="420" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-accent) 4%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
        <text x="60" y="444" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Aggregate root</text>

        <rect x="180" y="436" width="14" height="10" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
        <text x="200" y="444" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Entity</text>

        <rect x="268" y="436" width="14" height="10" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-ink) 4%, transparent)" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="288" y="444" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Join table</text>

        <text x="372" y="444" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="388" y="444" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Primary key</text>

        <text x="476" y="444" fill="var(--dd-ink)" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="492" y="444" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Foreign key</text>

        <text x="584" y="444" fill="var(--dd-muted)" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="616" y="444" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Cardinality</text>
      </svg>
  </div>
</body>
</html>
