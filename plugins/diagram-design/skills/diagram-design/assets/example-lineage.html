<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dim_customer · lineage</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lineage · Diagram Design</p>
    <h1>dim_customer · provenance and impact</h1>

    <svg viewBox="0 0 1120 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lineage-title lineage-desc">
      <title id="lineage-title">Lineage of dim_customer: provenance and downstream impact</title>
      <desc id="lineage-desc">Upstream, raw_crm_contacts and raw_billing_accounts feed stg_customer, which with stg_region feeds dim_customer. Downstream, dim_customer feeds fct_orders and mart_revenue directly, fct_orders also feeds mart_revenue, and mart_revenue feeds a cohort of 12 dashboards.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/>
        </pattern>
        <marker id="arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="var(--dd-muted)"/>
        </marker>
        <marker id="arr-link" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
          <path d="M0 0 L7 3 L0 6 Z" fill="var(--dd-link)"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Column / hop headers -->
      <text x="108" y="52" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 HOPS UPSTREAM</text>
      <text x="288" y="52" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 HOP UPSTREAM</text>
      <text x="468" y="52" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SELECTED</text>
      <text x="648" y="52" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 HOP DOWNSTREAM</text>
      <text x="828" y="52" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 HOPS DOWNSTREAM</text>
      <text x="1008" y="52" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 HOPS DOWNSTREAM</text>

      <!-- Upstream edges (derives-from), ink/muted -->
      <line x1="180" y1="112" x2="220" y2="112" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <path d="M110,200 V180 Q110,172 118,172 H282 Q290,172 290,164 V144" fill="none" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <path d="M360,112 H462 Q470,112 470,120 V140" fill="none" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>
      <path d="M360,232 H462 Q470,232 470,224 V204" fill="none" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arr-muted)"/>

      <!-- Downstream edges (impact-if-changed), link-blue -->
      <line x1="540" y1="164" x2="580" y2="164" stroke="var(--dd-link)" stroke-width="1" marker-end="url(#arr-link)"/>
      <line x1="720" y1="156" x2="760" y2="156" stroke="var(--dd-link)" stroke-width="1" marker-end="url(#arr-link)"/>
      <path d="M540,188 V228 Q540,236 548,236 H752 Q760,236 760,228 V188" fill="none" stroke="var(--dd-link)" stroke-width="1" marker-end="url(#arr-link)"/>
      <line x1="900" y1="172" x2="940" y2="172" stroke="var(--dd-link)" stroke-width="1" marker-end="url(#arr-link)"/>

      <!-- Upstream: 2 hops -->
      <rect x="40" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="56" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · UPSTREAM</text>
      <text x="56" y="116" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">raw_crm_contacts</text>

      <rect x="40" y="200" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="56" y="216" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · UPSTREAM</text>
      <text x="56" y="236" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">raw_billing_accounts</text>

      <!-- Upstream: 1 hop -->
      <rect x="220" y="80" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="236" y="96" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · UPSTREAM</text>
      <text x="236" y="116" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">stg_customer</text>

      <rect x="220" y="200" width="140" height="64" rx="6" class="dd-node" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="236" y="216" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · UPSTREAM</text>
      <text x="236" y="236" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">stg_region</text>

      <!-- Selected -->
      <rect x="400" y="140" width="140" height="64" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <text x="416" y="156" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · FOCAL</text>
      <text x="416" y="176" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">dim_customer</text>

      <!-- Downstream: 1 hop -->
      <rect x="580" y="140" width="140" height="64" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-link) 6%, transparent)" stroke="var(--dd-link)" stroke-width="1"/>
      <text x="596" y="156" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · DOWNSTREAM</text>
      <text x="596" y="176" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">fct_orders</text>

      <!-- Downstream: 2 hops -->
      <rect x="760" y="140" width="140" height="64" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-link) 6%, transparent)" stroke="var(--dd-link)" stroke-width="1"/>
      <text x="776" y="156" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · DOWNSTREAM</text>
      <text x="776" y="176" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">mart_revenue</text>

      <!-- Downstream: 3 hops — a cohort, not 12 individual boxes -->
      <rect x="948" y="148" width="140" height="64" rx="6" fill="var(--dd-paper-2)" stroke="var(--dd-rule-solid)" stroke-width="1"/>
      <rect x="956" y="156" width="140" height="64" rx="6" fill="var(--dd-paper-2)" stroke="var(--dd-rule-solid)" stroke-width="1"/>
      <rect x="940" y="140" width="140" height="64" rx="6" class="dd-node" fill="color-mix(in srgb, var(--dd-link) 6%, transparent)" stroke="var(--dd-link)" stroke-width="1"/>
      <text x="956" y="156" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.1em">ASSET · DOWNSTREAM</text>
      <text x="956" y="176" fill="var(--dd-ink)" font-size="9.5" font-weight="600" font-family="'Geist Mono', monospace">Dashboards</text>
      <rect x="1052" y="128" width="32" height="16" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="1068" y="140" fill="var(--dd-ink)" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">×12</text>

      <!-- Legend -->
      <line x1="40" y1="284" x2="1080" y2="284" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="40" y="300" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="180" y="292" width="16" height="8" rx="2" class="dd-tag" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="200" y="300" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Upstream — derives-from</text>

      <rect x="400" y="292" width="16" height="8" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-link) 6%, transparent)" stroke="var(--dd-link)" stroke-width="1"/>
      <text x="420" y="300" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Downstream — impact-if-changed</text>

      <rect x="660" y="292" width="16" height="8" rx="2" class="dd-tag" fill="color-mix(in srgb, var(--dd-accent) 7%, transparent)" stroke="var(--dd-accent)" stroke-width="1"/>
      <text x="680" y="300" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Selected asset</text>

      <text x="848" y="300" fill="var(--dd-ink)" font-size="9" font-family="'Geist Mono', monospace" font-weight="600">×12</text>
      <text x="880" y="300" fill="var(--dd-muted)" font-size="8.5" font-family="'DM Sans', sans-serif">Aggregated cohort, count stated</text>
    </svg>
  </div>
</body>
</html>
