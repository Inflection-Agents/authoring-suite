<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The self-improving loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&amp;family=DM+Sans:wght@300;400;500&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --sans: 'DM Sans', system-ui, sans-serif;
      --serif: 'Cormorant Garamond', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--dd-paper); color: var(--dd-ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--dd-muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--dd-ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 900px; }
    .ring { fill: none; stroke: var(--dd-muted); stroke-width: 1.2; }
    .spoke { fill: none; stroke: var(--dd-soft); stroke-width: 1; stroke-dasharray: 5 4; }
    .station { fill: var(--dd-paper); stroke: var(--dd-ink); stroke-width: 1; }
    .station.focal { fill: var(--dd-accent-tint); stroke: var(--dd-accent); stroke-width: 1.2; }
    .hub { fill: var(--dd-ink); }
    .node-name { fill: var(--dd-ink); font: 600 12px var(--sans); text-anchor: middle; }
    .focal-name { fill: var(--dd-accent); }
    .sublabel { fill: var(--dd-soft); font: 400 8px var(--mono); text-anchor: middle; }
    .hub-name { fill: var(--dd-paper); font: 600 16px var(--sans); text-anchor: middle; }
    .hub-sub { fill: var(--dd-paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
    .arrow-label { fill: var(--dd-soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }

    /* Radius rides the token; the literal rx attribute stays as a Safari fallback. */
    .dd-node      { rx: var(--dd-radius-node); }
    .dd-tag       { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Loop · Diagram Design</p>
    <h1>The self-improving loop</h1>

    <svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
      <title id="loop-title">The self-improving loop</title>
      <desc id="loop-desc">Six stations flow clockwise from Capture through Learn and back to Capture. Each station writes shared state into one central memory hub, with Decide highlighted as the human approval gate.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="color-mix(in srgb, var(--dd-ink) 10%, transparent)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-soft)"/></marker>
      </defs>
      <rect width="1040" height="680" fill="var(--dd-paper)"/>
      <rect width="1040" height="680" fill="url(#dots)" opacity="0.55"/>

      <!-- Solid clockwise ring: six arcs on the same r=240 station circle. -->
      <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#arrow)"/>
      <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#arrow)"/>
      <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#arrow)"/>
      <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#arrow)"/>
      <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#arrow)"/>
      <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#arrow)"/>

      <!-- Dashed write-backs: station inner edge to 6px before the hub stroke. -->
      <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M672 252 L616 284" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M672 428 L616 396" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M520 548 V400" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M368 428 L424 396" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M368 252 L424 284" marker-end="url(#arrow-soft)"/>

      <!-- Curated spoke labels sit beside the line with an 8px visible gap. -->
      <rect x="532" y="200" width="48" height="16" rx="4" fill="var(--dd-paper)"/>
      <text x="556" y="212" class="arrow-label">SIGNALS</text>
      <rect x="460" y="464" width="52" height="16" rx="4" fill="var(--dd-paper)"/>
      <text x="486" y="476" class="arrow-label">OUTCOMES</text>

      <!-- Stations -->
      <rect class="station dd-node" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="96" class="node-name">Capture</text><text x="520" y="116" class="sublabel">signals in / intake</text>

      <rect class="station dd-node" x="648" y="188" width="160" height="64" rx="6"/>
      <text x="728" y="216" class="node-name">Research</text><text x="728" y="236" class="sublabel">evidence pulled</text>

      <rect class="station focal dd-node" x="648" y="428" width="160" height="64" rx="6"/>
      <text x="728" y="456" class="node-name focal-name">Decide</text><text x="728" y="476" class="sublabel">human approves</text>

      <rect class="station dd-node" x="440" y="548" width="160" height="64" rx="6"/>
      <text x="520" y="576" class="node-name">Act</text><text x="520" y="596" class="sublabel">work ships</text>

      <rect class="station dd-node" x="232" y="428" width="160" height="64" rx="6"/>
      <text x="312" y="456" class="node-name">Measure</text><text x="312" y="476" class="sublabel">outcomes logged</text>

      <rect class="station dd-node" x="232" y="188" width="160" height="64" rx="6"/>
      <text x="312" y="216" class="node-name">Learn</text><text x="312" y="236" class="sublabel">playbook updated</text>

      <!-- The one shared-state hub. -->
      <rect class="hub dd-container" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">Shared memory</text>
      <text x="520" y="360" class="hub-sub">one record, every loop</text>
    </svg>
  </main>
</body>
</html>
