<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig4-failure-timeline-title fig4-failure-timeline-desc">
      <title id="fig4-failure-timeline-title">Restate replays once while Temporal retries into a second firing</title>
      <desc id="fig4-failure-timeline-desc">Two-lane failure timeline for one crash between steps: the owner-attested Restate lane replays once from the journal, while the Temporal lane retries the activity into a second firing.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>

      <!-- lanes -->
      <rect x="40" y="140" width="920" height="180" fill="none" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,4" class="dd-container"/>
      <rect x="40" y="356" width="920" height="188" fill="none" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,4" class="dd-container"/>
      <rect x="52" y="152" width="232" height="16" fill="var(--dd-paper)"/>
      <text x="168" y="164" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESTATE LANE · OWNER-ATTESTED</text>
      <rect x="52" y="368" width="108" height="16" fill="var(--dd-paper)"/>
      <text x="106" y="380" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEMPORAL LANE</text>

      <!-- crash line across both lanes -->
      <line x1="520" y1="124" x2="520" y2="560" stroke="var(--dd-accent)" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="488" y="104" width="64" height="16" fill="var(--dd-paper)"/>
      <text x="520" y="116" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRASH</text>

      <!-- Restate lane arrows -->
      <line x1="260" y1="248" x2="300" y2="248" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="420" y1="248" x2="500" y2="248" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="820" y1="248" x2="744" y2="248" stroke="var(--dd-accent)" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <rect x="748" y="216" width="68" height="12" fill="var(--dd-paper)"/>
      <text x="782" y="225" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLAY ONCE</text>

      <!-- Restate boxes -->
      <rect x="140" y="216" width="120" height="64" fill="var(--dd-paper)"/>
      <rect x="140" y="216" width="120" height="64" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="200" y="244" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Step 1</text>
      <text x="200" y="262" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">journaled</text>

      <rect x="300" y="216" width="120" height="64" fill="var(--dd-paper)"/>
      <rect x="300" y="216" width="120" height="64" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="360" y="244" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Step 2</text>
      <text x="360" y="262" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">journaled</text>

      <rect x="624" y="216" width="120" height="64" fill="var(--dd-paper)"/>
      <rect x="624" y="216" width="120" height="64" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="684" y="244" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Step 3</text>
      <text x="684" y="262" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">replayed</text>

      <rect x="820" y="216" width="100" height="64" fill="var(--dd-paper)"/>
      <rect x="820" y="216" width="100" height="64" rx="6" fill="color-mix(in srgb, var(--dd-ink) 5%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <text x="870" y="244" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Journal</text>
      <text x="870" y="262" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">source of truth</text>

      <!-- Temporal lane arrows -->
      <line x1="260" y1="464" x2="300" y2="464" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="420" y1="464" x2="604" y2="464" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 340 496 L 340 508 Q 340 516 348 516 L 392 516 Q 400 516 400 508 L 400 496" fill="none" stroke="var(--dd-link)" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="344" y="524" width="52" height="12" fill="var(--dd-paper)"/>
      <text x="370" y="533" fill="var(--dd-link)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRY</text>

      <!-- Temporal boxes -->
      <rect x="140" y="432" width="120" height="64" fill="var(--dd-paper)"/>
      <rect x="140" y="432" width="120" height="64" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="200" y="460" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Activity</text>
      <text x="200" y="478" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1st firing</text>

      <rect x="300" y="432" width="120" height="64" fill="var(--dd-paper)"/>
      <rect x="300" y="432" width="120" height="64" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="360" y="460" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Activity</text>
      <text x="360" y="478" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">crashed mid-run</text>

      <rect x="604" y="432" width="140" height="64" fill="var(--dd-paper)"/>
      <rect x="604" y="432" width="140" height="64" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <text x="674" y="460" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Activity</text>
      <text x="674" y="478" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2nd firing</text>

      <!-- legend -->
      <line x1="30" y1="592" x2="970" y2="592" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="30" y="616" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="30" y1="632" x2="46" y2="632" stroke="var(--dd-accent)" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="54" y="636" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">OWNER-ATTESTED REPLAY</text>
      <line x1="250" y1="632" x2="266" y2="632" stroke="var(--dd-link)" stroke-width="1" marker-end="url(#arrow-link)"/>
      <text x="274" y="636" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">RETRY · 2ND FIRING</text>
      <line x1="470" y1="624" x2="470" y2="640" stroke="var(--dd-accent)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="478" y="636" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">CRASH INSTANT</text>
    </svg>