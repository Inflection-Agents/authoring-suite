<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue-As-New chain — Fig 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .dd-node { rx: var(--dd-radius-node); }
    .dd-tag { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Muse white paper · Fig 3</p>
    <h1>One workflow, hand-cut into three</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig3-continuation-chain-title fig3-continuation-chain-desc">
      <title id="fig3-continuation-chain-title">Long workflow cut into linked executions</title>
      <desc id="fig3-continuation-chain-desc">Three linked executions inside one long-workflow boundary, with the team-owned seams of cut point, state-carry schema and signal forwarding labeled at each link.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>

      <!-- workflow boundary -->
      <rect x="40" y="140" width="920" height="240" fill="none" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,4" class="dd-container"/>
      <rect x="52" y="152" width="148" height="16" fill="var(--dd-paper)"/>
      <text x="126" y="164" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONE LONG WORKFLOW</text>

      <!-- links first: link 1 focal, link 2 default -->
      <line x1="300" y1="280" x2="400" y2="280" stroke="var(--dd-accent)" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <line x1="600" y1="280" x2="700" y2="280" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- seam labels, stacked above each link on open canvas -->
      <rect x="312" y="224" width="76" height="12" fill="var(--dd-paper)"/>
      <text x="350" y="233" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CUT POINT</text>
      <rect x="312" y="240" width="76" height="12" fill="var(--dd-paper)"/>
      <text x="350" y="249" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE SCHEMA</text>
      <rect x="312" y="256" width="76" height="12" fill="var(--dd-paper)"/>
      <text x="350" y="265" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNAL FWD</text>

      <rect x="612" y="224" width="76" height="12" fill="var(--dd-paper)"/>
      <text x="650" y="233" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CUT POINT</text>
      <rect x="612" y="240" width="76" height="12" fill="var(--dd-paper)"/>
      <text x="650" y="249" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE SCHEMA</text>
      <rect x="612" y="256" width="76" height="12" fill="var(--dd-paper)"/>
      <text x="650" y="265" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNAL FWD</text>

      <!-- execution boxes -->
      <rect x="100" y="228" width="200" height="104" fill="var(--dd-paper)"/>
      <rect x="100" y="228" width="200" height="104" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <rect x="108" y="236" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="122" y="245" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="200" y="284" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Execution N</text>
      <text x="200" y="304" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">history 1..K</text>

      <rect x="400" y="228" width="200" height="104" fill="var(--dd-paper)"/>
      <rect x="400" y="228" width="200" height="104" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <rect x="408" y="236" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="422" y="245" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="500" y="284" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Execution N+1</text>
      <text x="500" y="304" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">carried state in</text>

      <rect x="700" y="228" width="200" height="104" fill="var(--dd-paper)"/>
      <rect x="700" y="228" width="200" height="104" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <rect x="708" y="236" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="722" y="245" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
      <text x="800" y="284" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Execution N+2</text>
      <text x="800" y="304" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">signals re-routed</text>

      <!-- team-owned note -->
      <text x="500" y="420" fill="var(--dd-muted)" font-size="12" font-style="italic" font-family="'Cormorant Garamond', serif" text-anchor="middle">Every link is a seam the team owns: where to cut, what schema crosses, which signals follow.</text>

      <!-- legend -->
      <line x1="30" y1="500" x2="970" y2="500" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="30" y="524" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="30" y1="540" x2="46" y2="540" stroke="var(--dd-accent)" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="54" y="544" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">HAND CUT · TEAM-OWNED</text>
      <line x1="250" y1="540" x2="266" y2="540" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="274" y="544" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">CHAINED LINK</text>
      <rect x="430" y="536" width="16" height="8" fill="none" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="454" y="544" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">WORKFLOW BOUNDARY</text>
    </svg>
  </div>
</body>
</html>
