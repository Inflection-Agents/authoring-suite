<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deployment shapes side by side — Fig 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .dd-node { rx: var(--dd-radius-node); }
    .dd-tag { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · Muse white paper · Fig 2</p>
    <h1>One binary versus six seams</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig2-deployment-shapes-title fig2-deployment-shapes-desc">
      <title id="fig2-deployment-shapes-title">Restate single binary beside Temporal distributed topology</title>
      <desc id="fig2-deployment-shapes-desc">Side-by-side deployment comparison: one Restate binary box against Temporal frontend, history, matching and worker services plus external database and visibility store, with dashed failover seams marked.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>

      <!-- containers -->
      <rect x="40" y="120" width="400" height="360" fill="none" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,4" class="dd-container"/>
      <rect x="540" y="120" width="420" height="360" fill="none" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="4,4" class="dd-container"/>
      <rect x="52" y="132" width="140" height="16" fill="var(--dd-paper)"/>
      <text x="122" y="144" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESTATE · ONE BINARY</text>
      <rect x="552" y="132" width="168" height="16" fill="var(--dd-paper)"/>
      <text x="636" y="144" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEMPORAL · DISTRIBUTED</text>

      <!-- arrows first -->
      <line x1="644" y1="236" x2="644" y2="272" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="724" y1="198" x2="756" y2="198" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="724" y1="310" x2="756" y2="310" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="836" y1="236" x2="836" y2="272" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="872" y1="348" x2="872" y2="376" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="608" y1="348" x2="608" y2="376" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- seam labels on the open band between services and stores -->
      <rect x="884" y="352" width="36" height="12" fill="var(--dd-paper)"/>
      <text x="902" y="361" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEAM</text>
      <rect x="556" y="352" width="36" height="12" fill="var(--dd-paper)"/>
      <text x="574" y="361" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEAM</text>

      <!-- Restate focal box -->
      <rect x="140" y="240" width="200" height="100" fill="var(--dd-paper)"/>
      <rect x="140" y="240" width="200" height="100" rx="6" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <rect x="148" y="248" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-accent)" stroke-width="0.8"/>
      <text x="162" y="257" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="240" y="292" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Restate</text>
      <text x="240" y="310" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one binary · no seams</text>

      <!-- Temporal service boxes -->
      <rect x="564" y="160" width="160" height="76" fill="var(--dd-paper)"/>
      <rect x="564" y="160" width="160" height="76" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <rect x="572" y="168" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="586" y="177" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="644" y="206" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Frontend</text>
      <text x="644" y="222" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">routing :7233</text>

      <rect x="756" y="160" width="160" height="76" fill="var(--dd-paper)"/>
      <rect x="756" y="160" width="160" height="76" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <rect x="764" y="168" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="778" y="177" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="836" y="206" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">History</text>
      <text x="836" y="222" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mutable state</text>

      <rect x="564" y="272" width="160" height="76" fill="var(--dd-paper)"/>
      <rect x="564" y="272" width="160" height="76" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <rect x="572" y="280" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="586" y="289" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="644" y="318" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Worker</text>
      <text x="644" y="334" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">polls matching</text>

      <rect x="756" y="272" width="160" height="76" fill="var(--dd-paper)"/>
      <rect x="756" y="272" width="160" height="76" rx="6" fill="var(--dd-node-white)" stroke="var(--dd-ink)" stroke-width="1"/>
      <rect x="764" y="280" width="28" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="778" y="289" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="836" y="318" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Matching</text>
      <text x="836" y="334" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">task queues</text>

      <!-- stores -->
      <rect x="564" y="376" width="160" height="64" fill="var(--dd-paper)"/>
      <rect x="564" y="376" width="160" height="64" rx="6" fill="color-mix(in srgb, var(--dd-ink) 5%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <rect x="572" y="384" width="32" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="588" y="393" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="644" y="416" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Visibility</text>
      <text x="644" y="432" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">elastic store</text>

      <rect x="756" y="376" width="160" height="64" fill="var(--dd-paper)"/>
      <rect x="756" y="376" width="160" height="64" rx="6" fill="color-mix(in srgb, var(--dd-ink) 5%, transparent)" stroke="var(--dd-muted)" stroke-width="1"/>
      <rect x="764" y="384" width="24" height="12" rx="2" fill="transparent" stroke="var(--dd-muted)" stroke-width="0.8"/>
      <text x="776" y="393" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="836" y="416" fill="var(--dd-ink)" font-size="12" font-weight="600" font-family="'DM Sans', sans-serif" text-anchor="middle">Database</text>
      <text x="836" y="432" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">external :5432</text>

      <!-- legend -->
      <line x1="30" y1="548" x2="970" y2="548" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="30" y="572" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="30" y1="588" x2="46" y2="588" stroke="var(--dd-muted)" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="54" y="592" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">IN-PROCESS CALL</text>
      <line x1="230" y1="588" x2="246" y2="588" stroke="var(--dd-muted)" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="254" y="592" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">FAILOVER SEAM</text>
      <rect x="430" y="584" width="16" height="8" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1.6"/>
      <text x="454" y="592" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">SINGLE-BINARY DEPLOY</text>
    </svg>
  </div>
</body>
</html>
