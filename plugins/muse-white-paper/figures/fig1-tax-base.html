<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Length is the tax base — Fig 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dd-paper: #F5F2EC;
      --dd-paper-2: #EDE9E0;
      --dd-node-white: #ffffff;
      --dd-ink: #1B2B3C;
      --dd-muted: #4A6275;
      --dd-soft: #6E8799;
      --dd-rule: rgba(27,43,60,0.14);
      --dd-rule-solid: #C8C4BB;
      --dd-accent: #967A3A;
      --dd-accent-tint: rgba(150,122,58,0.10);
      --dd-link: #3A5F8B;
      --dd-series-1: #B0934B;
      --dd-series-2: #4A6275;
      --dd-series-3: #7AAE8E;
      --dd-series-4: #C47A4A;
      --dd-series-5: #6B5B8B;
      --dd-wash-2: rgba(27,43,60,0.02);
      --dd-wash-3: rgba(27,43,60,0.03);
      --dd-wash-5: rgba(27,43,60,0.05);
      --dd-wash-10: rgba(74,98,117,0.10);
      --dd-wash-20: rgba(27,43,60,0.20);
      --dd-wash-30: rgba(27,43,60,0.30);
      --dd-radius-node: 2px;
      --dd-radius-tag: 2px;
      --dd-radius-container: 4px;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--dd-paper);
      color: var(--dd-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dd-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--dd-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .dd-node { rx: var(--dd-radius-node); }
    .dd-tag { rx: var(--dd-radius-tag); }
    .dd-container { rx: var(--dd-radius-container); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line chart · Muse white paper · Fig 1</p>
    <h1>Length is the tax base</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1-tax-base-title fig1-tax-base-desc">
      <title id="fig1-tax-base-title">Plumbing cost share rises with workflow lifetime</title>
      <desc id="fig1-tax-base-desc">Two-line chart showing Temporal plumbing cost climbing past the history-limit region as workflows lengthen, while the Restate line stays flat.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--dd-link)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="var(--dd-paper)"/>

      <!-- history-limit region -->
      <rect x="600" y="120" width="320" height="320" fill="color-mix(in srgb, var(--dd-accent) 8%, transparent)" stroke="var(--dd-accent)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="688" y="132" width="144" height="16" fill="var(--dd-paper)"/>
      <text x="760" y="144" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HISTORY LIMIT</text>

      <!-- gridlines + y labels -->
      <line x1="120" y1="440" x2="920" y2="440" stroke="var(--dd-rule-solid)" stroke-width="1"/>
      <line x1="120" y1="364" x2="920" y2="364" stroke="var(--dd-rule)" stroke-width="0.8"/>
      <line x1="120" y1="288" x2="920" y2="288" stroke="var(--dd-rule)" stroke-width="0.8"/>
      <line x1="120" y1="212" x2="920" y2="212" stroke="var(--dd-rule)" stroke-width="0.8"/>
      <line x1="120" y1="136" x2="920" y2="136" stroke="var(--dd-rule)" stroke-width="0.8"/>
      <text x="108" y="444" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0%</text>
      <text x="108" y="368" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20%</text>
      <text x="108" y="292" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40%</text>
      <text x="108" y="216" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">60%</text>
      <text x="108" y="140" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80%</text>

      <!-- x labels -->
      <text x="120" y="464" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DAY 1</text>
      <text x="280" y="464" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DAY 30</text>
      <text x="440" y="464" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DAY 90</text>
      <text x="600" y="464" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DAY 180</text>
      <text x="760" y="464" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DAY 300</text>
      <text x="920" y="464" fill="var(--dd-soft)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">DAY 365</text>
      <text x="520" y="492" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKFLOW LIFETIME</text>
      <text x="48" y="288" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em" transform="rotate(-90 48 288)">PLUMBING SHARE</text>

      <!-- Restate flat series -->
      <polyline points="120,400 280,400 440,400 600,400 760,400 920,400"
                fill="none" stroke="var(--dd-series-2)" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="796" y="404" width="88" height="16" fill="var(--dd-paper)"/>
      <text x="840" y="416" fill="var(--dd-series-2)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESTATE FLAT</text>

      <!-- Temporal climbing series (focal) -->
      <polyline points="120,400 280,388 440,360 600,312 760,248 920,180"
                fill="none" stroke="var(--dd-accent)" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="120" cy="400" r="4" fill="var(--dd-accent)"/>
      <circle cx="280" cy="388" r="4" fill="var(--dd-accent)"/>
      <circle cx="440" cy="360" r="4" fill="var(--dd-accent)"/>
      <circle cx="600" cy="312" r="4" fill="var(--dd-accent)"/>
      <circle cx="760" cy="248" r="4" fill="var(--dd-accent)"/>
      <circle cx="920" cy="180" r="4" fill="var(--dd-accent)"/>
      <rect x="788" y="196" width="96" height="16" fill="var(--dd-paper)"/>
      <text x="836" y="208" fill="var(--dd-accent)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TEMPORAL CLIMBS</text>

      <!-- legend -->
      <line x1="30" y1="552" x2="970" y2="552" stroke="color-mix(in srgb, var(--dd-ink) 10%, transparent)" stroke-width="0.8"/>
      <text x="30" y="576" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="30" y="588" width="16" height="8" fill="none" stroke="var(--dd-accent)" stroke-width="1.8"/>
      <text x="54" y="596" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">TEMPORAL COST SHARE</text>
      <rect x="250" y="588" width="16" height="8" fill="none" stroke="var(--dd-series-2)" stroke-width="1.2"/>
      <text x="274" y="596" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">RESTATE COST SHARE</text>
      <rect x="470" y="588" width="16" height="8" fill="color-mix(in srgb, var(--dd-accent) 8%, transparent)" stroke="var(--dd-accent)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <text x="494" y="596" fill="var(--dd-muted)" font-size="8" font-family="'Geist Mono', monospace">HISTORY-LIMIT REGION</text>
    </svg>
  </div>
</body>
</html>
